], exam: EX([
  ["By next year, I ___ my degree.", ["will have finished", "will finish", "will be finishing", "finish"], 0, "By next year is a future deadline, so use the future perfect: will have finished."],
  ["I wish I ___ to the party last night.", ["had gone", "went", "would go", "go"], 0, "Wish plus the past perfect expresses a regret about the past: had gone."],
  ["The house ___ in 1890.", ["is said to have been built", "is said to build", "said to build", "is saying"], 0, "Is said to have been built is the passive form for a belief about a past event."],
  ["She asked me ___ the window.", ["to close", "close", "closing", "closed"], 0, "Ask someone to do something uses to plus the infinitive: to close."],
  ["Never ___ such a delicious meal.", ["have I eaten", "I have eaten", "I ate", "did I eat"], 0, "After a negative word at the start, such as Never, the subject and auxiliary are inverted: have I eaten."],
  ["___ the bad weather, the match went ahead.", ["Despite", "Although", "However", "Because"], 0, "Despite is followed by a noun and shows contrast: Despite the bad weather."],
  ["She finally ___ smoking last year.", ["gave up", "gave in", "gave out", "gave away"], 0, "Gave up means stopped doing something: gave up smoking."],
  ["It was my sister ___ found my lost keys.", ["who", "which", "where", "whom"], 0, "Who is used for people in a relative clause: my sister who found my keys."],
  ["I had my hair ___ yesterday.", ["cut", "cutting", "to cut", "cuts"], 0, "Have plus object plus past participle means someone else does the job: had my hair cut."],
  ["My car needs ___.", ["washing", "to wash", "wash", "washed"], 0, "Need plus -ing has a passive meaning: needs washing means needs to be washed."],
  ["If she ___ harder, she would have passed.", ["had studied", "studied", "studies", "would study"], 0, "Third conditional: if plus had studied, then would have passed."],
  ["I ___ the phone when I heard the news.", ["was using", "used", "have used", "use"], 0, "Was using is the action in progress when the news came, a shorter event."],
  ["The meeting has been ___ until next Monday.", ["put off", "put on", "put out", "put up"], 0, "Put off means postponed, so the passive is has been put off."],
  ["___ it was late, we decided to keep going.", ["Although", "Despite", "However", "Therefore"], 0, "Although is followed by a full clause and shows contrast: Although it was late."],
  ["The villagers returned only ___ the storm had passed.", ["after", "although", "despite", "however"], 0, "After is followed by a clause here: after the storm had passed."],
  ["The man ___ car was stolen filed a report.", ["whose", "who", "which", "where"], 0, "Whose shows possession: the man whose car was stolen."],
  ["By the end of June, they ___ the project.", ["will have completed", "will complete", "will be completing", "complete"], 0, "By the end of June is a future deadline: will have completed."],
  ["I'd rather you ___ anyone about it.", ["didn't tell", "don't tell", "won't tell", "wouldn't tell"], 0, "I'd rather plus the past simple expresses a wish about the present or future: didn't tell."],
  ["It is the rain ___ ruined our picnic.", ["that", "which", "where", "when"], 0, "That is used in a cleft sentence for things: It is the rain that ruined our picnic."],
  ["Not only ___ the exam, but he also won a prize.", ["did he pass", "he passed", "he did pass", "passed he"], 0, "Not only with inversion uses did plus subject: Not only did he pass the exam."]
])},
{ code: "C1", title: "Advanced professional English", sub: "Formal writing and nuanced argument", lessons: [
  { name: "Advanced inversion", ex: [
    { t: "explain", title: "الانقلاب المتقدم", body: "<p>بعد كلمات زي <b>Hardly / Scarcely / Barely</b> بنستخدم <b>had + subject + V3</b> مع <b>when</b>: <i>Hardly had we reached the house when it began to rain.</i></p><p>في الشروط الرسمية نحذف if ونقلب: <i>Were I in your place...</i> / <i>Had I known...</i> / <i>Should you need help...</i></p><p>و<b>Under no circumstances</b> و<b>Only then</b> و<b>Little did she know</b> كمان بتتقلب.</p>" },
    { t: "mc", q: "Under no circumstances ___ the password to anyone.", o: ["should you disclose", "you should disclose", "disclose you", "disclosing"], a: 0, e: "Under no circumstances + inversion." },
    { t: "order", q: "Put the words in the right order.", words: ["Not", "until", "whistle", "the", "leave", "did", "stadium", "final", "the", "the", "fans"], a: "Not until the final whistle did the fans leave the stadium", e: "Not until + inversion in the main clause." },
    { t: "dialog", q: "A: Did the manager approve the plan?\\nB: Only after the board ___ its concerns did she sign it.", o: ["had addressed", "addressing", "address", "addresses"], a: 0, e: "Only after + had + V3, then inversion." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "Scarcely had the audience taken their seats when the lights went out.", o: ["The audience sat down after the lights went out.", "The lights went out just after the audience sat down.", "The audience was not sitting.", "The lights stayed on for an hour."], a: 1, e: "Scarcely had ... when: the lights went out right after they sat." },
    { t: "mc", q: "Little ___ that the decision would change her life.", o: ["did she realise", "she realised", "realised she", "she did realise"], a: 0, e: "Little did she realise: inversion for emphasis." },
    { t: "mc", q: "Seldom ___ such a talented young musician.", o: ["have I come across", "I have come across", "I come across", "come I across"], a: 0, e: "Seldom + inversion." },
    { t: "speak", q: "Say this sentence out loud.", text: "Had I known about the delay, I would have cancelled the trip.", e: "Had I known: stress KNOWN." },
    { t: "mc", q: "Never before ___ such a beautiful sunset from this hill.", o: ["had I seen", "I had seen", "I saw", "seen I"], a: 0, e: "Never before + had + subject + V3." },
    { t: "mc", q: "Hardly ___ a word when the teacher entered.", o: ["had he said", "he had said", "said he", "he said"], a: 0, e: "Hardly had he said a word." },
    { t: "mc", q: "Only then ___ the results, which had been delayed for weeks.", o: ["did we receive", "we received", "received we", "we did receive"], a: 0, e: "Only then + inversion in the main clause." },
    { t: "dialog", q: "A: Shall we go out now?\\nB: No sooner ___ dinner than the rain started, so let's stay in.", o: ["had we finished", "we had finished", "we finished", "finished we"], a: 0, e: "No sooner had + subject + V3 than." },
    { t: "mc", q: "Rarely ___ such a clear explanation of a complex issue.", o: ["have I heard", "I have heard", "I heard", "heard I"], a: 0, e: "Rarely + inversion." },
    { t: "order", q: "Put the words in the right order.", words: ["variety", "Nowhere", "you", "world", "else", "such", "in", "will", "the", "find"], a: "Nowhere else in the world will you find such variety", e: "Nowhere + inversion." },
    { t: "speak", q: "Say this sentence out loud.", text: "Not only did the company lose money, but it also lost its reputation.", e: "Reputation: rep-yoo-TAY-shun." },
    { t: "mc", q: "Were it not for your support, we ___ the project.", o: ["would never finish", "would never have finished", "will never finish", "never finished"], a: 0, e: "Were it not for + would + base (present unreal)." },
    { t: "mc", q: "Had it not been for the rain, we ___ to the beach.", o: ["would have gone", "will have gone", "went", "have gone"], a: 0, e: "Had it not been for + would have + V3." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hardly had I entered the house when it began to rain. Were I in your position, I would apologise. Should you need any help, please call me. Had they left earlier, they would have avoided the traffic.", o: ["Hardly had I entered the house when it began to rain.","Hardly I had entered the house when it began to rain.","Hardly had I enter the house when it began to rain.","Hardly I entered the house when it began to rain."], a: 0, e: "Hardly + had + subject + past participle.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hardly had I entered the house when it began to rain. Were I in your position, I would apologise. Should you need any help, please call me. Had they left earlier, they would have avoided the traffic.", o: ["Were I in your position, I will apologise.","Were I in your position, I would apologise.","Were I in your position, I would apologises.","Were I in you position, I would apologise."], a: 1, e: "Inverted conditional: were I + would.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hardly had I entered the house when it began to rain. Were I in your position, I would apologise. Should you need any help, please call me. Had they left earlier, they would have avoided the traffic.", o: ["Should you needs any help, please call me.","Should you need any help, please calling me.","Should you need any help, please call me.","Should you need any helps, please call me."], a: 2, e: "Should + subject + base verb (formal if).", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hardly had I entered the house when it began to rain. Were I in your position, I would apologise. Should you need any help, please call me. Had they left earlier, they would have avoided the traffic.", o: ["Had they left earlier, they would avoid the traffic.","Had they leave earlier, they would have avoided the traffic.","Had they left earlier, they would have avoid the traffic.","Had they left earlier, they would have avoided the traffic."], a: 3, e: "Had + subject + past participle, would have + past participle.", rate: 1 },
  ]},
  { name: "Subjunctive and formal structures", ex: [
    { t: "explain", title: "المضارع المطلق الرسمي", body: "<p>بعد أفعال زي <b>suggest / demand / insist / recommend / request / order</b>، وبعد تعبيرات زي <b>it is essential / vital / imperative that</b>، بنستخدم <b>الفعل الأساسي</b> بدون s: <i>It is essential that he be present.</i></p><p>وده رسمي جداً، وبيتكتب في التقارير والقوانين والمراسلات الرسمية.</p>" },
    { t: "mc", q: "It is vital that the report ___ on time.", o: ["be", "being", "was", "will be"], a: 0, e: "Subjunctive: be after vital that." },
    { t: "order", q: "Put the words in the right order.", words: ["instructions", "crucial", "is", "the", "that", "It", "everyone", "read", "carefully"], a: "It is crucial that everyone read the instructions carefully", e: "Crucial that + base verb." },
    { t: "dialog", q: "A: Should I call the manager?\\nB: Yes, I suggest that you ___ him right away.", o: ["call", "calls", "called", "calling"], a: 0, e: "Suggest that + base verb." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "The committee requested that the decision be reviewed before the end of the month.", o: ["The committee reviewed the decision last month.", "The committee refused to review the decision.", "The committee asked for the decision to be looked at again before the month ended.", "The decision was never reviewed."], a: 2, e: "Requested that ... be reviewed: asked for a review." },
    { t: "mc", q: "The board insisted that every manager ___ the report before Monday.", o: ["submit", "submits", "submitted", "submitting"], a: 0, e: "Insist that + base verb." },
    { t: "mc", q: "Were the price ___ lower, more people would buy it.", o: ["to be", "being", "be", "was"], a: 0, e: "Were + subject + to + base: a formal conditional." },
    { t: "speak", q: "Say this sentence out loud.", text: "It is essential that you be on time.", e: "Be: say it as \"bee\", with a clear stress." },
    { t: "mc", q: "The teacher insisted that every student ___ the rules.", o: ["follow", "follows", "followed", "following"], a: 0, e: "Insist that + base verb." },
    { t: "mc", q: "She requested that the meeting ___ postponed.", o: ["be", "being", "was", "will be"], a: 0, e: "Request that + be + V3." },
    { t: "mc", q: "If I ___ you, I would take the offer.", o: ["were", "am", "be", "been"], a: 0, e: "Were is the subjunctive in if-clauses." },
    { t: "dialog", q: "A: Shall we start?\\nB: Let's wait until everyone ___ here.", o: ["is", "be", "was", "will be"], a: 0, e: "Until with a real present situation uses the indicative." },
    { t: "mc", q: "The judge ordered that the evidence ___ examined again.", o: ["be", "being", "was", "will be"], a: 0, e: "Order that + be + V3." },
    { t: "order", q: "Put the words in the right order.", words: ["I", "we", "that", "next", "until", "decision", "year", "the", "postpone", "propose"], a: "I propose that we postpone the decision until next year", e: "Propose that + base verb." },
    { t: "speak", q: "Say this sentence out loud.", text: "The board recommends that the proposal be accepted.", e: "Be accepted: bee ak-SEP-tid." },
    { t: "mc", q: "It is imperative that the patient ___ immediately.", o: ["be seen", "being seen", "sees", "will see"], a: 0, e: "Imperative that + be + V3." },
    { t: "mc", q: "It is necessary that everyone ___ a copy of the policy.", o: ["have", "to have", "had", "having"], a: 0, e: "Subjunctive: base form have." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is essential that every student submit the form by Friday. The doctor recommended that he exercise more. I insist that she be informed immediately. The manager suggested that the report be finished tonight.", o: ["It is essential that every student submits the form by Friday.","It is essential that every student submit the form by Friday.","It is essential that every student to submit the form by Friday.","It is essential that every student submitting the form by Friday."], a: 1, e: "Subjunctive: base verb after essential that.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is essential that every student submit the form by Friday. The doctor recommended that he exercise more. I insist that she be informed immediately. The manager suggested that the report be finished tonight.", o: ["The doctor recommended that he exercises more.","The doctor recommended that he to exercise more.","The doctor recommended that he exercise more.","The doctor recommended that he exercising more."], a: 2, e: "Subjunctive after recommended that: base verb.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is essential that every student submit the form by Friday. The doctor recommended that he exercise more. I insist that she be informed immediately. The manager suggested that the report be finished tonight.", o: ["I insist that she is informed immediately.","I insist that she will be informed immediately.","I insist that she to be informed immediately.","I insist that she be informed immediately."], a: 3, e: "Subjunctive after insist that: be.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is essential that every student submit the form by Friday. The doctor recommended that he exercise more. I insist that she be informed immediately. The manager suggested that the report be finished tonight.", o: ["The manager suggested that the report be finished tonight.","The manager suggested that the report is finished tonight.","The manager suggested that the report will be finished tonight.","The manager suggested that the report to be finished tonight."], a: 0, e: "Subjunctive after suggested that: be + past participle.", rate: 1 },
  ]},
  { name: "Nominalisation and formal register", ex: [
    { t: "explain", title: "تحويل الفعل لاسم", body: "<p>في الكتابة الرسمية بنحوّل الفعل لاسم علشان الجملة تبقى أرصن وأكثف: <b>decide → decision</b>، <b>develop → development</b>، <b>implement → implementation</b>، <b>analyse → analysis</b>، <b>persuade → persuasion</b>.</p><p>وده بيخلي الكلام أقل حشو وأكتر دقة.</p>" },
    { t: "mc", q: "The ___ was made by the board yesterday.", o: ["decision", "decide", "decided", "deciding"], a: 0, e: "Noun of decide." },
    { t: "order", q: "Put the words in the right order.", words: ["criticised", "response", "to", "the", "crisis", "The", "government's", "widely", "was"], a: "The government's response to the crisis was widely criticised", e: "Nouns make formal writing more compact." },
    { t: "dialog", q: "A: Why was the project delayed?\\nB: The main cause was the ___ of qualified staff.", o: ["shortage", "shorten", "shortly", "shorter"], a: 0, e: "Noun of short: shortage." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "The reduction of costs was achieved through the improvement of supply chains.", o: ["Costs were reduced because supply chains were improved.", "Costs increased after supply chains were changed.", "Supply chains were reduced.", "Costs were not discussed."], a: 0, e: "Reduction and improvement are nouns for reduced and improved." },
    { t: "mc", q: "The ___ of the evidence led the jury to a verdict.", o: ["evaluation", "evaluate", "evaluated", "evaluative"], a: 0, e: "Noun of evaluate." },
    { t: "mc", q: "There has been a significant ___ in unemployment.", o: ["increase", "increasing", "increased", "increasingly"], a: 0, e: "Increase as a noun." },
    { t: "speak", q: "Say this sentence out loud.", text: "The implementation of the policy requires careful planning.", e: "Stress: im-pli-men-TAY-shun." },
    { t: "mc", q: "Her ___ was impressive, and the committee finally agreed.", o: ["persuasion", "persuade", "persuaded", "persuasive"], a: 0, e: "Noun of persuade: persuasion." },
    { t: "mc", q: "The ___ of the report was excellent: clear, concise and accurate.", o: ["presentation", "present", "presented", "presentable"], a: 0, e: "Noun form of present." },
    { t: "mc", q: "We need a better ___ of the risks involved.", o: ["understanding", "understand", "understood", "understands"], a: 0, e: "Noun form of understand." },
    { t: "dialog", q: "A: How will we measure success?\\nB: By the ___ of the results against the targets.", o: ["comparison", "compare", "compared", "comparable"], a: 0, e: "Noun of compare." },
    { t: "mc", q: "The ___ of the product was delayed by three months.", o: ["launch", "launched", "launcher", "launchable"], a: 0, e: "Launch as a noun." },
    { t: "order", q: "Put the words in the right order.", words: ["of", "Asia", "the", "expansion", "decision", "bold", "a", "The", "into", "was", "company"], a: "The expansion of the company into Asia was a bold decision", e: "Noun of expand: expansion." },
    { t: "speak", q: "Say this sentence out loud.", text: "The analysis of the data revealed an unexpected pattern.", e: "Stress: uh-NAL-uh-sis." },
    { t: "mc", q: "The ___ of the committee is to review all applications.", o: ["purpose", "purposely", "purposeful", "purposing"], a: 0, e: "Noun of purpose." },
    { t: "mc", q: "Several new ___ will affect all banks from next year.", o: ["regulations", "regulate", "regulated", "regulating"], a: 0, e: "Noun of regulate: regulation, plural regulations." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "The implementation of the new policy will begin next month. The company's development of the new software took five years. After careful analysis of the data, we reached a conclusion. The removal of the old system will be announced soon.", o: ["The implement of the new policy will begin next month.","The implemented of the new policy will begin next month.","The implementation of the new policy will begin next month.","The implementation of the new policy will began next month."], a: 2, e: "Noun form: implementation.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "The implementation of the new policy will begin next month. The company's development of the new software took five years. After careful analysis of the data, we reached a conclusion. The removal of the old system will be announced soon.", o: ["The company develop the new software took five years.","The company's developed of the new software took five years.","The company's development of the new software take five years.","The company's development of the new software took five years."], a: 3, e: "Noun form: development, with took.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "The implementation of the new policy will begin next month. The company's development of the new software took five years. After careful analysis of the data, we reached a conclusion. The removal of the old system will be announced soon.", o: ["After careful analysis of the data, we reached a conclusion.","After careful analysed of the data, we reached a conclusion.","After careful analysis of the data, we reach a conclusion.","After careful analysis of the data, we reached a conclusions."], a: 0, e: "Noun form: analysis.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "The implementation of the new policy will begin next month. The company's development of the new software took five years. After careful analysis of the data, we reached a conclusion. The removal of the old system will be announced soon.", o: ["The remove of the old system will be announced soon.","The removal of the old system will be announced soon.","The removed of the old system will be announced soon.","The removal of the old system will announce soon."], a: 1, e: "Noun form: removal.", rate: 1 },
  ]},
  { name: "Advanced conditionals and alternatives", ex: [
    { t: "explain", title: "الشروط والبدائل", body: "<p><b>unless</b> = إلا لو. <b>provided / as long as</b> = بشرط إن. <b>otherwise / or else</b> = وإلا.</p><p><b>But for / Were it not for / Had it not been for</b> = لولا.</p><p><b>Even if</b> = حتى لو.</p>" },
    { t: "mc", q: "As long as you ___ hard, you will pass.", o: ["work", "will work", "worked", "works"], a: 0, e: "As long as + present simple." },
    { t: "order", q: "Put the words in the right order.", words: ["finished", "the", "match", "would", "for", "it", "rain,", "been", "not", "have", "the", "Had", "we"], a: "Had it not been for the rain, we would have finished the match", e: "Had it not been for + would have + V3." },
    { t: "dialog", q: "A: Can I borrow your notes?\\nB: Yes, ___ you return them by Monday.", o: ["provided that", "unless", "otherwise", "but"], a: 0, e: "Provided that for a condition." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "Unless the weather improves, the festival will be cancelled.", o: ["The festival will be cancelled if the weather improves.", "The festival will be cancelled if the weather does not improve.", "The weather will improve for the festival.", "The festival is happening regardless of the weather."], a: 1, e: "Unless = if not." },
    { t: "mc", q: "The project would have failed ___ the extra funding.", o: ["had it not been for", "were it not for", "unless", "otherwise"], a: 0, e: "Past condition: had it not been for." },
    { t: "mc", q: "Take an umbrella, ___ you will get wet.", o: ["or else", "unless", "provided", "as long as"], a: 0, e: "Or else = otherwise." },
    { t: "speak", q: "Say this sentence out loud.", text: "Provided that you pay in advance, we can give you a discount.", e: "Provided: pruh-VY-ded." },
    { t: "fill", q: "Were it not ___ your help, we would be lost.", a: "for", e: "Were it not for + noun." },
    { t: "mc", q: "I'll accept the job ___ the salary is competitive.", o: ["as long as", "unless", "otherwise", "but"], a: 0, e: "As long as = if and only if." },
    { t: "mc", q: "___ she been warned, she would have stayed away.", o: ["Had", "Were", "Did", "Should"], a: 0, e: "Had + subject + V3 instead of if." },
    { t: "dialog", q: "A: Will the meeting be cancelled?\\nB: Not unless the manager ___ ill.", o: ["falls", "will fall", "fell", "falling"], a: 0, e: "Unless + present simple." },
    { t: "mc", q: "We'll only win the contract ___ we lower our prices.", o: ["if", "unless", "however", "although"], a: 0, e: "Only if = a necessary condition." },
    { t: "order", q: "Put the words in the right order.", words: ["not", "apologise,", "forgive", "Unless", "she", "you", "you", "will"], a: "Unless you apologise, she will not forgive you", e: "Unless + present simple, will + base verb." },
    { t: "speak", q: "Say this sentence out loud.", text: "As long as you keep trying, you will improve.", e: "As long as: stress LONG." },
    { t: "mc", q: "Had it not been for the doctor's quick action, he ___ alive today.", o: ["would not be", "would not have been", "will not be", "is not"], a: 0, e: "Past condition with a present result: a mixed conditional." },
    { t: "mc", q: "The concert will go ahead, ___ the weather is terrible.", o: ["even if", "otherwise", "unless", "provided"], a: 0, e: "Even if = no matter if." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You can use the car provided that you bring it back before six. We will leave at nine unless it rains. Hurry up, or we will miss the train. You can stay here as long as you keep quiet.", o: ["You can use the car provided that you bring it back before sixes.","You can use the car provided that you will bring it back before six.","You can use the car provide that you bring it back before six.","You can use the car provided that you bring it back before six."], a: 3, e: "Provided that: a condition.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You can use the car provided that you bring it back before six. We will leave at nine unless it rains. Hurry up, or we will miss the train. You can stay here as long as you keep quiet.", o: ["We will leave at nine unless it rains.","We will leave at nine unless it will rain.","We will leave at nine unless it rain.","We will leave at nine if it not rains."], a: 0, e: "Unless = if not, with a present verb.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You can use the car provided that you bring it back before six. We will leave at nine unless it rains. Hurry up, or we will miss the train. You can stay here as long as you keep quiet.", o: ["Hurry up, or we miss the train will.","Hurry up, or we will miss the train.","Hurry up, or we will missing the train.","Hurry up, or we would miss the train."], a: 1, e: "Or + will for a warning.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You can use the car provided that you bring it back before six. We will leave at nine unless it rains. Hurry up, or we will miss the train. You can stay here as long as you keep quiet.", o: ["You can stay here as long as you will keep quiet.","You can stay here as long as you kept quiet.","You can stay here as long as you keep quiet.","You can stay here as long as you keeps quiet."], a: 2, e: "As long as + present simple: a condition.", rate: 1 },
  ]},
  { name: "Modal perfect and speculation", ex: [
    { t: "explain", title: "الافتراض عن الماضي", body: "<p><b>must have + V3</b> = أكيد حصل. <b>might / may / could have + V3</b> = ممكن يكون حصل. <b>can't have + V3</b> = مستحيل يكون حصل.</p><p><b>should have + V3</b> = كان المفروض، و<b>needn't have + V3</b> = ما كانش لازم، لكن حصل.</p>" },
    { t: "mc", q: "They ___ the wrong road yesterday, which is why they were late.", o: ["might have taken", "might took", "might take", "might to take"], a: 0, e: "Might have + V3: a possibility about the past." },
    { t: "order", q: "Put the words in the right order.", words: ["earlier", "have", "about", "She", "told", "the", "change", "me", "could"], a: "She could have told me about the change earlier", e: "Could have + V3: past possibility." },
    { t: "dialog", q: "A: Where is Karim? He isn't answering.\\nB: He ___ asleep. He was up very late.", o: ["may have fallen", "may fell", "may falls", "may have fall"], a: 0, e: "May have fallen: a possible past conclusion." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "He should have warned us about the storm, but he didn't.", o: ["He warned us about the storm.", "He was supposed to warn us, but he did not.", "He did not need to warn us.", "He warned us, although he did not have to."], a: 1, e: "Should have + V3: it was his duty, and he did not do it." },
    { t: "mc", q: "That ___ be the right answer; it doesn't make sense.", o: ["can't", "mustn't", "needn't", "couldn't have been"], a: 0, e: "Can't be: strong disbelief in the present." },
    { t: "mc", q: "I ___ so much money on the holiday last summer. I should have saved more.", o: ["spent", "spend", "have spent", "spending"], a: 0, e: "Spent: the simple past for a finished action." },
    { t: "speak", q: "Say this sentence out loud.", text: "You should have told me the truth.", e: "Say \"should have\" as \"shud uv\" (not \"should of\")." },
    { t: "mc", q: "The package ___ last Tuesday, but it is still missing.", o: ["should have arrived", "should arrive", "should arrived", "shouldn't arrive"], a: 0, e: "Should have + V3 for an expected past event." },
    { t: "mc", q: "We ___ taken a taxi; we would have been on time.", o: ["should have", "should", "must", "can"], a: 0, e: "Should have + V3." },
    { t: "mc", q: "It ___ be true! I don't believe it.", o: ["can't", "mustn't", "needn't", "isn't"], a: 0, e: "Can't be: strong disbelief." },
    { t: "dialog", q: "A: Did you lock the car?\\nB: I'm not sure. I ___ it, but I can't remember.", o: ["might have forgotten", "might forget", "must forget", "can forget"], a: 0, e: "Might have forgotten: a possibility about the past." },
    { t: "mc", q: "You ___ worry so much. Everything worked out fine.", o: ["needn't have", "mustn't have", "can't have", "couldn't"], a: 0, e: "Needn't have + V3: it was not necessary." },
    { t: "mc", q: "The shop ___ closed by now. It's only five o'clock.", o: ["can't be", "mustn't be", "couldn't have been", "needn't be"], a: 0, e: "Can't be closed: strong disbelief about the present." },
    { t: "speak", q: "Say this sentence out loud.", text: "She could have been a great actress.", e: "Could have been: kood uv bin." },
    { t: "mc", q: "The thief ___ through the window last night. The glass is still broken.", o: ["must have entered", "must enter", "must entered", "should entering"], a: 0, e: "Must have entered: a logical conclusion about the past." },
    { t: "mc", q: "I ___ known about the problem earlier. I would have helped.", o: ["should have", "could", "must", "mustn't"], a: 0, e: "Should have known: a past duty." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "She can't have taken the train; she is still at home. He must have read the email last night, because he replied at six this morning. I should have called my mother yesterday, but I completely forgot. They might have left already.", o: ["She can't have taken the train; she is still at home.","She can't have take the train; she is still at home.","She can't has taken the train; she is still at home.","She can't taken the train; she is still at home."], a: 0, e: "Can't have + past participle: a past certainty.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "She can't have taken the train; she is still at home. He must have read the email last night, because he replied at six this morning. I should have called my mother yesterday, but I completely forgot. They might have left already.", o: ["He must read the email last night.","He must have read the email last night.","He must have reading the email last night.","He must has read the email last night."], a: 1, e: "Must have + past participle: a past deduction.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "She can't have taken the train; she is still at home. He must have read the email last night, because he replied at six this morning. I should have called my mother yesterday, but I completely forgot. They might have left already.", o: ["I should have call my mother yesterday, but I completely forgot.","I should have calling my mother yesterday, but I completely forgot.","I should have called my mother yesterday, but I completely forgot.","I should has called my mother yesterday, but I completely forgot."], a: 2, e: "Should have + past participle: a missed past duty.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "She can't have taken the train; she is still at home. He must have read the email last night, because he replied at six this morning. I should have called my mother yesterday, but I completely forgot. They might have left already.", o: ["They might have leave already.","They might left already.","They might having left already.","They might have left already."], a: 3, e: "Might have + past participle: a past possibility.", rate: 1 },
  ]},
  { name: "Discourse markers and argument", ex: [
    { t: "explain", title: "روابط الحجة والنقاش", body: "<p><b>furthermore / moreover</b> = علاوة على ذلك. <b>on the contrary</b> = على العكس. <b>by and large</b> = بشكل عام.</p><p><b>all things considered</b> = بعد ما نأخد كل حاجة في الاعتبار. <b>to put it another way</b> = بعبارة تانية. <b>that said</b> = مع ذلك.</p>" },
    { t: "mc", q: "The results were disappointing. ___ put it another way, we failed.", o: ["To", "In", "By", "On"], a: 0, e: "To put it another way = in other words." },
    { t: "order", q: "Put the words in the right order.", words: ["suggests", "that", "flawed", "the", "theory", "is", "the", "evidence", "Moreover,"], a: "Moreover, the evidence suggests that the theory is flawed", e: "Moreover adds a related point." },
    { t: "dialog", q: "A: Was the trip worth the money?\\nB: ___, yes. The views were amazing and the hotel was great.", o: ["By and large", "On the contrary", "Despite", "Furthermore"], a: 0, e: "By and large = generally." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "Far from being lazy, the students worked harder than ever before.", o: ["The students were lazy.", "The students worked harder than before, the opposite of being lazy.", "The students did not work at all.", "The students stopped working."], a: 1, e: "Far from being lazy = the opposite of lazy." },
    { t: "mc", q: "The argument is logical. ___, it is supported by solid evidence.", o: ["Furthermore", "On the contrary", "Despite", "Although"], a: 0, e: "Furthermore adds a supporting point." },
    { t: "mc", q: "Some say the project is a waste. ___, it has already saved the company millions.", o: ["On the contrary", "Despite", "Although", "Because"], a: 0, e: "On the contrary = the opposite of what was said." },
    { t: "speak", q: "Say this sentence out loud.", text: "All things considered, I think we made the right decision.", e: "Stress: con-SID-erd, and de-SIZH-un." },
    { t: "mc", q: "The company's profits fell. ___, the board decided to cut costs.", o: ["Consequently", "Despite", "Although", "On the contrary"], a: 0, e: "Consequently = as a result." },
    { t: "mc", q: "___ this is a short-term solution, it may be enough for now.", o: ["Although", "Despite", "Furthermore", "In spite"], a: 0, e: "Although + clause." },
    { t: "mc", q: "I agree with you on most points. ___, I'd like to raise a concern.", o: ["That said", "On the contrary", "Despite", "Although"], a: 0, e: "That said = however." },
    { t: "mc", q: "The evidence is weak. ___, the conclusion is still plausible.", o: ["Nevertheless", "Furthermore", "Moreover", "In addition"], a: 0, e: "Nevertheless: despite that." },
    { t: "order", q: "Put the words in the right order.", words: ["study", "said,", "several", "has", "the", "That", "limitations"], a: "That said, the study has several limitations", e: "That said = however." },
    { t: "mc", q: "The city has grown rapidly. ___, traffic has become a serious problem.", o: ["As a result", "On the contrary", "Although", "Despite"], a: 0, e: "As a result: a consequence." },
    { t: "speak", q: "Say this sentence out loud.", text: "To put it another way, we are running out of time.", e: "Stress: tuh PUT it uh-NUH-ther." },

/* ---------- Word wrapping ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function words(text) {
  return esc(text).replace(/[A-Za-z][A-Za-z'’-]*/g, function (w) {
    var k = w.replace(/’/g, "'").toLowerCase();
    return glossFor(k) ? '<span class="w" data-w="' + esc(k) + '">' + w + '</span>' : w;
  });
}

/* ---------- State and unlocking ---------- */
var KEY = 'eng-path-v2', st, cur = null;
try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { st = {}; }
st.xp = st.xp || 0; st.done = st.done || {}; st.passed = st.passed || {}; st.best = st.best || {};
st.streak = st.streak || 0; st.last = st.last || '';
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} cloudSave(); }
function touchStreak() {
  var t = new Date().toDateString(); if (st.last === t) return;
  var y = new Date(Date.now() - 864e5).toDateString();
  st.streak = st.last === y ? st.streak + 1 : 1; st.last = t; save();
}
function $(s) { return document.querySelector(s); }
function norm(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' '); }
function passMark(L) { return Math.ceil(L.exam.length * 0.8); }
function passPct(L) { return '80%'; }
function levelOpen(li) { return li === 0 || !!st.passed[LEVELS[li - 1].code]; }
function lessonOpen(li, k) { return levelOpen(li) && (k === 0 || !!st.done[LEVELS[li].code + '-' + (k - 1)]); }
function lessonsDone(li) { return LEVELS[li].lessons.every(function (_, k) { return !!st.done[LEVELS[li].code + '-' + k]; }); }
function examOpen(li) { return levelOpen(li) && lessonsDone(li); }

function stats() {
  var passedN = LEVELS.filter(function (L) { return st.passed[L.code]; }).length;
  $('#stats').innerHTML = '<span class="pill">Streak<b>' + st.streak + '</b></span><span class="pill">XP<b>' + st.xp + '</b></span><span class="pill">Levels<b>' + passedN + '/' + LEVELS.length + '</b></span>';
}

function home() {
  cur = null; stats();
  var h = '<section class="hero"><h2>Start at A2</h2><p>Finish a level\'s lessons, then pass its ' + LEVELS[0].exam.length + '-question exam with 80% to open the next level.</p><button class="btn ghost" id="placeBtn">Take the level test</button></section>';
  LEVELS.forEach(function (L, li) {

    L.lessons.forEach(function (les, k) {
      var done = !!st.done[L.code + '-' + k];
      h += '<button class="lesson' + (done ? ' done' : '') + '" data-u="' + li + '" data-l="' + k + '"' + (lessonOpen(li, k) ? '' : ' disabled') + '><span class="n">' + (done ? '&#10003;' : k + 1) + '</span><span>' + les.name + '<small>' + les.ex.filter(function (s) { return s.t !== 'explain'; }).length + ' exercises</small></span></button>';
    });

    h += '</section>';

/* ---------- Dialog and speaking helpers ---------- */
function dialogLines(q) {
  return String(q).split('\\n').map(function (ln) {
    var m = ln.match(/^\s*([A-Za-z]+):\s*(.*)$/);
    return m ? { who: m[1], text: m[2] } : { who: '', text: ln.trim() };
  });
}
function dialogSpeech(q, fill) {
  return dialogLines(q).map(function (l) { return l.text.replace('___', fill); }).join('. ');
}
function dialogHtml(q) {
  return '<div class="chat">' + dialogLines(q).map(function (l) {
    var txt = l.text.split('___').map(function (p) { return words(p); }).join('<span class="gap" id="gap">___</span>');
    var who = l.who ? '<small>' + esc(l.who) + '</small>' : '';
    return '<div class="bubble' + (l.who === 'B' ? ' b' : '') + '">' + who + txt + '</div>';
  }).join('') + '</div>';
}
function speakNorm(s) { return String(s).toLowerCase().replace(/’/g, "'").match(/[a-z0-9']+/g) || []; }
function speakScore(target, heard) {
  var pool = heard.slice(), hit = 0;
  target.forEach(function (w) { var j = pool.indexOf(w); if (j >= 0) { hit++; pool.splice(j, 1); } });
  return target.length ? hit / target.length : 0;
}
function finishSpeak(ok, heardTxt, skipped) {
  var ex = curEx();
  cur.answered = true; cur.lastSpeak = ex.text;
  if (ok) { cur.ok++; st.xp += 10; save(); }
  $('#mstat').textContent = heardTxt;
  $('#mic').disabled = true; var s = $('#said'); if (s) s.style.display = 'none';
  $('#fb').innerHTML = '<div class="fb ' + (skipped ? '' : (ok ? 'ok' : 'bad')) + '"><b>' + (skipped ? 'Skipped' : (ok ? 'Correct!' : 'Not quite.')) + '</b>' + esc(ex.e) + '<br><button class="speak" id="hear">&#9654; Listen</button></div>';
  $('#go').textContent = 'Continue'; enableGo(); stats();
}
function startMic() {
  var ms = $('#mstat'), said = $('#said');
  function fallback(msg) { ms.textContent = msg; said.style.display = ''; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return fallback('الميكروفون مش متاح في المتصفح ده. يمكنك تخطي التقييم الذاتي، لكن لن يُتحقق من نطقك.');
  var rec, got = false;
  try { rec = new SR(); } catch (e) { return fallback('الميكروفون مش شغال. يمكنك تخطي التقييم الذاتي دون التحقق من النطق.'); }
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  rec.onresult = function (ev) {
    got = true;
    var target = speakNorm(curEx().text), best = 0, heard = '';
    for (var i = 0; i < ev.results[0].length; i++) {
      var alt = ev.results[0][i].transcript, sc = speakScore(target, speakNorm(alt));
      if (sc > best) { best = sc; heard = alt; }
    }
    finishSpeak(best >= 0.8, heard ? 'سمعت: "' + heard + '" (' + Math.round(best * 100) + '%)' : 'ما سمعتش كلام واضح');
  };
  rec.onerror = function (ev) {
    fallback(ev.error === 'not-allowed' ? 'اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح، أو تخطَّ التقييم الذاتي دون احتساب نطقك على أنه متحقق.' : 'ما سمعتش حاجة. جرّب تاني أو تخطَّ التقييم الذاتي دون التحقق من النطق.');
  };
  rec.onend = function () { if (!got && !cur.answered) said.style.display = ''; };
  ms.textContent = 'بتكلم... قول الجملة';
  try { rec.start(); } catch (e) { fallback('الميكروفون مش شغال. يمكنك تخطي التقييم الذاتي دون التحقق من النطق.'); }
}

function enableGo() {
  var g = $('#go'); if (!g) return;
  if (cur.answered) { g.disabled = false; return; }
  var ex = curEx();
  var ready = ex.t === 'fill' ? norm($('#ans').value) !== '' : ex.t === 'order' ? cur.picked.length === ex.words.length : cur.sel !== null;
  g.disabled = !ready;
}

function check() {
  var ex = curEx(), ok, answerText;
  if (ex.t === 'mc' || ex.t === 'listen' || ex.t === 'dialog') {
    ok = cur.sel === ex.a; answerText = ex.o[ex.a];
    document.querySelectorAll('.opt').forEach(function (b) {
      b.disabled = true; var k = +b.dataset.k;
      if (k === ex.a) b.classList.add('right'); else if (k === cur.sel) b.classList.add('wrong');
    });
  } else if (ex.t === 'fill') {
    ok = norm($('#ans').value) === norm(ex.a); answerText = ex.a; $('#ans').disabled = true;
  } else {
    ok = cur.picked.map(function (i) { return ex.words[i]; }).join(' ') === ex.a; answerText = ex.a;
    document.querySelectorAll('#pool .chip, #slot .chip').forEach(function (c) { c.disabled = true; });
  }
  if (ex.t === 'dialog') { var gp = document.getElementById('gap'); if (gp) { gp.textContent = answerText; gp.className = 'gap ok'; } }
  cur.lastSpeak = ex.t === 'listen' ? ex.text : ex.t === 'dialog' ? dialogSpeech(ex.q, answerText) : answerText;
  $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Correct!' : 'Not quite.') + '</b>' + esc(ex.e) + (ok ? '' : '<br>Answer: <b>' + esc(answerText) + '</b>') +
    '<br><button class="speak" id="hear">&#9654; Listen</button></div>';
  if (ok) { cur.ok++; st.xp += 10; save(); }
  cur.answered = true; $('#go').textContent = 'Continue'; enableGo(); stats();
}

function next() {
  cur.i++;

  showEx();
}

function finish() {
  var L = curLesson(), EXN = L.ex.filter(function (s) { return s.t !== 'explain'; }).length, need = Math.ceil(EXN * 0.8), pass = cur.ok >= need;
  if (pass && !st.done[LEVELS[cur.li].code + '-' + cur.k]) { st.done[LEVELS[cur.li].code + '-' + cur.k] = true; st.xp += 20; }
  save(); stats();
  $('#main').innerHTML = '<div class="card"><p class="kind">' + esc(L.name) + '</p><h2 class="q">' + (pass ? 'Lesson complete' : 'Almost there') + '</h2>' +
    '<p>' + cur.ok + ' of ' + EXN + ' correct. ' + (pass ? (lessonsDone(cur.li) ? 'The level exam is now open.' : 'The next lesson is open.') : 'You need ' + need + ' correct to pass. Try again.') + '</p>' +
    (pass ? '' : '<button class="btn" id="retry">Try again</button>') + '<button class="btn ghost" id="back" style="width:100%;margin-top:10px">Back to the path</button></div>';
}

/* ---------- Level exam (20 questions, 80% to pass) ---------- */
function shuffleQ(q) {
  var idx = q.o.map(function (_, k) { return k; });
  for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  var c = {}; Object.keys(q).forEach(function (k) { c[k] = q[k]; });
  c.o = idx.map(function (k) { return q.o[k]; });
  c.a = idx.indexOf(q.a);
  return c;
}
function startExam(li) { cur = { exam: true, li: li, i: 0, ok: 0, wrong: [], qs: LEVELS[li].exam.map(shuffleQ) }; showExam(); }
function showExam() {
  var E = cur.qs, q = E[cur.i];
  $('#main').innerHTML = '<div class="bar"><button class="x" id="quit" aria-label="Quit">&times;</button><div class="prog"><i style="width:' + (cur.i / E.length * 100) + '%"></i></div></div>' +
    '<div class="card"><p class="kind">' + LEVELS[cur.li].code + ' level exam &middot; ' + (cur.i + 1) + '/' + E.length + '</p>' +
    '<h2 class="q">' + esc(q.q) + '</h2>' +
    '<div class="qbtns"><button class="btn ghost" id="qsay">&#9654; Listen</button><button class="btn ghost" id="qslow">Slow</button></div>' +
    '<div class="opts">' + q.o.map(function (x, k) { return '<button class="opt ex" data-k="' + k + '">' + esc(x) + '</button>'; }).join('') + '</div></div>';
}
function examAnswer(k) {
  var E = cur.qs, q = E[cur.i];
  if (k === q.a) cur.ok++;
  else cur.wrong.push({ q: q.q.replace(/_+/g, '___'), you: q.o[k], right: q.o[q.a], e: q.e || '' });
  cur.i++;
  if (cur.i >= E.length) return finishExam();
  showExam();
}
function finishExam() {
  var L = LEVELS[cur.li], total = L.exam.length, need = passMark(L), pass = cur.ok >= need;
  st.best[L.code] = Math.max(st.best[L.code] || 0, cur.ok);
  if (pass && !st.passed[L.code]) { st.passed[L.code] = true; st.xp += 100; }
  save(); stats();
  var nextL = LEVELS[cur.li + 1];
  var wrongHtml = cur.wrong.length ? '<div class="unit" style="margin:14px 0">' + cur.wrong.map(function (w) {
    return '<div class="row" style="display:block"><div>' + esc(w.q) + '</div><small style="color:var(--bad)">You: ' + esc(w.you) + '</small> &nbsp; <small style="color:var(--ok)">Answer: ' + esc(w.right) + '</small>' + (w.e ? '<div style="font-size:14px;color:var(--mute);margin-top:4px">Why: ' + esc(w.e) + '</div>' : '') + '</div>';
  }).join('') + '</div>' : '';
  $('#main').innerHTML = '<div class="card"><p class="kind">' + L.code + ' level exam</p><h2 class="q">' + (pass ? 'Level passed' : 'Not yet') + '</h2>' +
    '<p>' + cur.ok + ' of ' + total + ' correct. You need ' + need + ' to pass (' + passPct(L) + ').' + (pass && nextL ? ' ' + nextL.code + ' is now open.' : '') + '</p>' + wrongHtml +
    (pass ? '' : '<button class="btn" id="retake">Retake exam</button>') +
    '<button class="btn ghost" id="back" style="width:100%;margin-top:10px">Back to the path</button></div>';
}

var FB_OK = false;
try { if (window.firebase) { firebase.initializeApp(FB_CONFIG); FB_OK = true; } } catch (e) { FB_OK = false; }
var FS = null;
try { if (FB_OK && firebase.firestore) FS = firebase.firestore(); } catch (e) { FS = null; }
var cloudTimer = null;
var cloudReadyUid = '';
var cloudLoadPromise = null;
function cloudSnapshot() {
  return { done: st.done, passed: st.passed, best: st.best, xp: st.xp, streak: st.streak, last: st.last };
}
function cloudWrite(uid, data) {
  if (!FS || !uid) return Promise.reject(new Error('Cloud sync is unavailable'));
  return FS.collection('progress').doc(uid).set(Object.assign({}, data, { updated: Date.now() }), { merge: true });
}
function cloudSave() {
  try {
    var uid = st && st.prefs && st.prefs.uid;
    if (!FS || !uid || cloudReadyUid !== uid) return;
    clearTimeout(cloudTimer);
    var snapshot = JSON.parse(JSON.stringify(cloudSnapshot()));
    cloudTimer = setTimeout(function () {
      if (st.prefs.uid !== uid || cloudReadyUid !== uid) return;
      cloudWrite(uid, snapshot).catch(function (e) { console.error('English Path cloud save failed:', e); });
    }, 800);
  } catch (e) { console.error('English Path cloud save error:', e); }
}
function cloudLoad(uid) {
  if (!FS || !uid) return Promise.resolve(false);
  cloudReadyUid = '';
  cloudLoadPromise = FS.collection('progress').doc(uid).get().then(function (d) {
    if (!st.prefs || st.prefs.uid !== uid) return false;
    if (d.exists) {
      var c = d.data() || {};
      Object.keys(c.done || {}).forEach(function (k) { st.done[k] = true; });
      Object.keys(c.passed || {}).forEach(function (k) { st.passed[k] = true; });
      Object.keys(c.best || {}).forEach(function (k) { st.best[k] = Math.max(st.best[k] || 0, Number(c.best[k]) || 0); });
      st.xp = Math.max(Number(st.xp) || 0, Number(c.xp) || 0);
      st.streak = Math.max(Number(st.streak) || 0, Number(c.streak) || 0);
      if (!st.last && c.last) st.last = c.last;
    }
    cloudReadyUid = uid;
    save();
    return true;
  }).catch(function (e) {
    console.error('English Path cloud load failed:', e);
    return false;
  });
  return cloudLoadPromise;
}
function applyUser(u) {
  var first = st.prefs.uid !== u.uid;
  st.prefs.uid = u.uid;
  st.prefs.guest = false;
  st.prefs.name = u.displayName || (st.prefs.name !== 'Guest' && st.prefs.name) || (u.email && u.email.split('@')[0]) || 'Friend';
  st.prefs.email = u.email || st.prefs.email || '';
  save(); applyTheme();
  if (first || cloudReadyUid !== u.uid) {
    cloudLoad(u.uid).then(function (loaded) {
      if (loaded && st.prefs.uid === u.uid && !cur && document.querySelector('#main .unit')) home();
      else if (!loaded && st.prefs.uid === u.uid) note('تعذر تحميل تقدمك من السحابة. لم نرفع بيانات الجهاز حتى لا نستبدل بيانات حسابك. تحقق من الاتصال ثم أعد تسجيل الدخول.', 8000);
    });
  }
}
function initAuth() {
  if (!FB_OK) return;
  try {
    firebase.auth().onAuthStateChanged(function (u) {
      if (u) { applyUser(u); if (document.getElementById('lemail') || document.getElementById('pname')) gate(); }
    });
  } catch (e) {}
}
function logout() {
  var uid = st.prefs && st.prefs.uid;
  clearTimeout(cloudTimer);
  var flush = Promise.resolve();
  if (uid && FS) {
    flush = Promise.resolve(cloudLoadPromise).then(function () {
      if (st.prefs.uid !== uid) return;
      if (cloudReadyUid !== uid) throw new Error('Progress was not loaded from the cloud');
      return cloudWrite(uid, JSON.parse(JSON.stringify(cloudSnapshot())));
    });
  }
  return flush.then(function () {
    return FB_OK ? firebase.auth().signOut() : null;
  }).then(function () {
    cloudReadyUid = '';
    st.done = {}; st.passed = {}; st.best = {}; st.xp = 0; st.streak = 0; st.last = '';
    st.prefs.uid = ''; st.prefs.guest = false; save(); stats(); cur = null;
    setupName();
  }).catch(function (e) {
    console.error('English Path logout sync failed:', e);
    note('لم يتم تسجيل الخروج لأن آخر تقدم لم يُحفظ بأمان. تحقق من الإنترنت وحاول مرة أخرى.', 8000);
  });
}
function authMsg(e) {
  var c = (e && e.code) || '';
  if (c === 'auth/invalid-email') return 'الإيميل مش صح';
  if (c === 'auth/email-already-in-use') return 'الإيميل ده عنده حساب بالفعل. سجل دخول';
  if (c === 'auth/weak-password') return 'الباسوورد ضعيف، خليه 6 حروف أو أكتر';
  if (c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/user-not-found') return 'الإيميل أو الباسوورد غلط';
  if (c === 'auth/too-many-requests') return 'محاولات كتير. استنى شوية وجرب تاني';
  if (c === 'auth/admin-restricted-operation') return 'التسجيل بحساب جديد مقفول في Firebase. ادخل Authentication > Settings > User actions وفعّل Create (sign-up)';
  if (c === 'auth/operation-not-allowed') return 'تسجيل الإيميل مش مفعّل في Firebase. فعّل Email/Password من Authentication > Sign-in method';
  if (c === 'auth/configuration-not-found') return 'Authentication لسه متفعّلش في Firebase. ادخل Authentication واضغط Get started';
  if (c === 'auth/password-does-not-meet-requirements') return 'الباسوورد مش مستوفي شروط الحماية في Firebase. جرب باسوورد أقوى فيه حروف وأرقام';
  if (c === 'auth/network-request-failed') return 'مفيش نت أو سيرفر Firebase مش بيرد. جرب تاني';
  if (c.indexOf('auth/requests-from-referer') === 0) return 'مفتاح Firebase مقيّد بدومين تاني. لازم تضيف دومين الموقع في إعدادات الـ API key';
  return 'مش قادر أدخلك دلوقتي (كود الخطأ: ' + (c || 'غير معروف') + ')';
}
function googleAuth() {
  if (!FB_OK) { note('تسجيل جوجل مش متاح دلوقتي'); return; }
  var prov = new firebase.auth.GoogleAuthProvider();
  return firebase.auth().signInWithPopup(prov)
    .then(function () { gate(); })
    .catch(function (e) {
      var c = (e && e.code) || '';
      if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      if (c === 'auth/popup-blocked') return note('المتصفح قفل نافذة جوجل. اسمح بالـ popups وجرب تاني', 5000);
      if (c === 'auth/unauthorized-domain') return note('دومين الموقع مش مضاف في Firebase > Authentication > Settings > Authorized domains', 7000);
      if (c === 'auth/operation-not-allowed') return note('Google مش مفعّل في Firebase > Authentication > Sign-in method', 7000);
      note(authMsg(e), 5000);
    });
}
function emailAuth(mode) {
  if (!FB_OK) { note('تسجيل الإيميل مش متاح دلوقتي'); return; }
  var em = ($('#lemail').value || '').trim(), pw = $('#lpass').value || '';
  if (!em) { note('اكتب الإيميل الأول'); return; }
  st.prefs.lastEmail = em; save();
  if (mode === 'reset') {
    return firebase.auth().sendPasswordResetEmail(em)
      .then(function () { note('تم إرسال رابط تغيير الباسوورد على الإيميل. شوف Spam كمان', 7000); })
      .catch(function (e) { note(e && e.code === 'auth/user-not-found' ? 'الإيميل ده مش موجود. اعمل حساب جديد' : authMsg(e), 5000); });
  }
  if (pw.length < 6) { note('الباسوورد لازم يكون 6 حروف أو أكتر'); return; }
  var op = mode === 'up' ? firebase.auth().createUserWithEmailAndPassword(em, pw) : firebase.auth().signInWithEmailAndPassword(em, pw);
  return op.then(function () { gate(); })
    .catch(function (e) { note(authMsg(e)); });
}

/* ---------- Gloss sheet ---------- */
function showGloss(w) {
  var g = glossFor(w); if (!g) return;
  $('#gword').textContent = w;
  var msaFirst = !!(st.prefs && st.prefs.arabic === 'MSA');
  $('#glbl1').textContent = msaFirst ? 'Arabic (formal)' : 'Egyptian';
  $('#gar').textContent = msaFirst ? g[0] : g[1];
  $('#glbl2').textContent = msaFirst ? 'Egyptian' : 'Arabic (formal)';
  $('#gegy').textContent = msaFirst ? g[1] : g[0];
  $('#gsame').classList.toggle('hide', String(g[0]).trim() !== String(g[1]).trim());
  $('#gex').textContent = GEX[w] || '';
  $('#gloss').classList.remove('hide');
  say(w);
}
function hideGloss() { $('#gloss').classList.add('hide'); }
$('#gclose').addEventListener('click', hideGloss);
$('#gsay').addEventListener('click', function () { say($('#gword').textContent); });

/* ---------- Events ---------- */
$('#main').addEventListener('click', function (e) {
  var wEl = e.target.closest && e.target.closest('.w');
  if (wEl && !e.target.closest('button')) { showGloss(wEl.dataset.w); return; }
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.classList.contains('lesson')) {
    if (t.dataset.x !== undefined) return startExam(+t.dataset.x);
    return start(+t.dataset.u, +t.dataset.l);
  }
  if (t.id === 'guestOpen') return guestView();
  if (t.id === 'guest') {
    var gn = ($('#pname').value || '').trim().slice(0, 30);
    if (!gn) { note('اكتب اسمك الأول'); return; }
    st.prefs.name = gn; st.prefs.guest = true; st.prefs.uid = ''; save(); applyTheme(); return gate();
  }
  if (t.id === 'toSignup') return signupView();
  if (t.id === 'toLogin') return setupName();
  if (t.id === 'emailIn') return emailAuth('in');
  if (t.id === 'emailUp') return emailAuth('up');
  if (t.id === 'emailReset') return emailAuth('reset');
  if (t.id === 'googleIn') return googleAuth();
  if (t.id === 'logout') return logout();
  if (t.id === 'enter') { welcome(); return home(); }
  if (t.id === 'saveName') {
    var nm = $('#pname').value.trim();
    if (!nm) { note('اكتب اسمك الأول'); return; }
    st.prefs.name = nm.slice(0, 30); st.prefs.email = $('#pemail').value.trim();
    save(); applyTheme(); return gate();
  }
  if (t.id === 'saveProfile') {
    st.prefs.name = $('#setName').value.trim().slice(0, 30) || st.prefs.name;
    st.prefs.email = $('#setEmail').value.trim();
    save(); applyTheme(); return note('تم حفظ البروفايل');
  }
  if (t.id === 'testVoice') return say('Hello, this is how I sound. Let us practise together.', false, true);
  if (t.dataset.theme !== undefined) { st.prefs.theme = t.dataset.theme; save(); applyTheme(); return settings(); }
  if (t.dataset.font !== undefined) { st.prefs.font = t.dataset.font; save(); applyTheme(); return settings(); }
  if (t.dataset.arabic !== undefined) { st.prefs.arabic = t.dataset.arabic; save(); return settings(); }
  if (t.dataset.toggle !== undefined) { var key = t.dataset.toggle; st.prefs[key] = st.prefs[key] === false; save(); return settings(); }
  if (t.id === 'back') return home();
  if (t.id === 'placeBtn') return startPlace();
  if (t.id === 'placeOk') return home();
  if (t.id === 'gotit') return next();
  if (t.dataset.say !== undefined) return say(t.dataset.say);
  if (t.classList.contains('pl')) return placeAnswer(+t.dataset.k);
  if (t.id === 'quit' || t.id === 'back') return home();
  if (t.id === 'retry') return start(cur.li, cur.k);
  if (t.id === 'retake') return startExam(cur.li);
  if (t.id === 'qsay') return say(qText(), false, false, curRate());
  if (t.id === 'qslow') return say(qText(), true, false, curRate());
  if (t.id === 'hear') return say(cur.lastSpeak || '');
  if (t.id === 'mic') return startMic();
  if (t.id === 'said') return finishSpeak(false, 'تم تخطي التقييم الذاتي؛ لم يتم التحقق من النطق.', true);
  if (t.id === 'go') return cur.answered ? next() : check();
  if (t.classList.contains('ex')) return examAnswer(+t.dataset.k);
  if (t.classList.contains('opt')) {
    cur.sel = +t.dataset.k;
    document.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('sel', x === t); });
    return enableGo();
  }
  if (t.dataset.w !== undefined) { cur.picked.push(+t.dataset.w); drawOrder(); return enableGo(); }
  if (t.dataset.p !== undefined) { cur.picked.splice(+t.dataset.p, 1); drawOrder(); return enableGo(); }
});
$('#main').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'ans' && $('#go') && !$('#go').disabled) { e.preventDefault(); cur.answered ? next() : check(); }
});
$('#main').addEventListener('change', function (e) {
  if (e.target.id === 'setVoice') { st.prefs.voice = e.target.value; save(); pickVoice(); }
});
$('#main').addEventListener('input', function (e) {
  if (e.target.id === 'setRate') { st.prefs.rate = +e.target.value; $('#rateV').textContent = st.prefs.rate.toFixed(2); save(); }
  if (e.target.id === 'setPitch') { st.prefs.pitch = +e.target.value; $('#pitchV').textContent = st.prefs.pitch.toFixed(2); save(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideGloss(); });

touchStreak();
boot();
</script>
