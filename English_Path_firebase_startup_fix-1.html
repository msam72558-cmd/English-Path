var VOICE = null;
function pickVoice() {
  try {
    var vs = speechSynthesis.getVoices() || [];
    if (typeof st !== 'undefined' && st && st.prefs && st.prefs.voice) {
      var chosen = vs.filter(function (v) { return v.name === st.prefs.voice; })[0];
      if (chosen) { VOICE = chosen; return; }
    }
    var pref = ['Microsoft Guy Online (Natural)', 'Microsoft Ryan Online (Natural)', 'Google UK English Male', 'Daniel', 'Alex', 'Microsoft Guy', 'Microsoft Ryan', 'Fred', 'George'];
    for (var i = 0; i < pref.length; i++) {
      var f = vs.filter(function (v) { return v.name.indexOf(pref[i]) >= 0; })[0];
      if (f) { VOICE = f; return; }
    }
    VOICE = vs.filter(function (v) { return /^en[-_](GB|US)/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  } catch (e) { VOICE = null; }
}
function refreshVoiceList() {
  var sel = document.getElementById('setVoice'); if (!sel) return;

}

  { name: "Comparing things (comparatives and superlatives)", ex: [

  { name: "Countable and uncountable (some, any, much, many)", ex: [

    { t: "dialog", q: "A: Should I bring something to the party?\\nB: No, you ___. Just come.", o: ["don't have to", "mustn't", "shouldn't", "must to"], a: 0, e: "Don't have to means it is not necessary." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You must wear a helmet when you ride a bike. It is the law. You look tired, so you should go to bed early tonight. I have to get up early tomorrow because I have an exam. You do not have to come to the meeting, but you should try.", o: ["You must wear a helmet when you ride a bike.","You must to wear a helmet when you ride a bike.","You musts wear a helmet when you ride a bike.","You must wearing a helmet when you ride a bike."], a: 0, e: "Must + base verb, no to.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You must wear a helmet when you ride a bike. It is the law. You look tired, so you should go to bed early tonight. I have to get up early tomorrow because I have an exam. You do not have to come to the meeting, but you should try.", o: ["You should to go to bed early tonight.","You should go to bed early tonight.","You shoulds go to bed early tonight.","You should going to bed early tonight."], a: 1, e: "Should + base verb.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "You must wear a helmet when you ride a bike. It is the law. You look tired, so you should go to bed early tonight. I have to get up early tomorrow because I have an exam. You do not have to come to the meeting, but you should try.", o: ["I have to getting up early tomorrow.","I has to get up early tomorrow.","I have to get up early tomorrow.","I must to get up early tomorrow."], a: 2, e: "Have to + base verb.", rate: 1 },

  { name: "Experiences and habits (have ever, used to)", ex: [
    { t: "explain", title: "Have you ever و used to", body: "<p><b>Have you ever...?</b> بنستخدمها نسأل عن تجربة في عمرك: Have you ever been to London? الإجابة: Yes, I have / No, I haven't.</p><p><b>used to</b> لعادة كانت موجودة في الماضي ومبقتش موجودة: I used to play football.</p>" },
    { t: "fill", q: "When I was a child, I ___ play in the street. (used to)", a: "used to", e: "Used to shows an old habit that no longer continues." },

    { t: "order", q: "Put the words in the right order.", words: ["than", "ten", "She", "countries", "has", "more", "visited"], a: "She has visited more than ten countries", e: "Has + past participle." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "I have been to Italy twice, and I have never been to Spain.", o: ["I have visited Italy and Spain.", "I have been to Italy twice, but never to Spain.", "I have never visited Italy.", "I visited Spain last year."], a: 2, e: "Have been to shows an experience." },
    { t: "dialog", q: "A: Have you ever tried sushi?\\nB: Yes, I ___ it last year.", o: ["tried", "have tried", "try", "trying"], a: 0, e: "In a question about experience, we answer with the past simple for a time in the past." },
    { t: "speak", q: "Say this sentence out loud.", text: "I used to live near the sea.", e: "Used to is pronounced YOOST-tuh." },

    { t: "fill", q: "Have you ___ seen this film? (ever)", a: "ever", e: "Ever is used in questions about experience." },
    { t: "mc", q: "They ___ never eaten fish before.", o: ["have", "has", "did", "are"], a: 0, e: "With they, use have." },
    { t: "order", q: "Put the words in the right order.", words: ["on", "Have", "ever", "a", "been", "plane", "you"], a: "Have you ever been on a plane", e: "Have + ever + past participle." },
    { t: "dialog", q: "A: Did you use to go to that school?\\nB: Yes, I ___ there for five years.", o: ["used to go", "use to go", "used go", "used to went"], a: 0, e: "Used to is followed by the base verb." },
    { t: "speak", q: "Say this sentence out loud.", text: "I have never been to Luxor.", e: "Have is short: hv, not hav." },
    { t: "mc", q: "I ___ to eat a lot of sweets when I was young.", o: ["used", "use", "used to", "is used"], a: 2, e: "Used to is followed by the base verb." },
    { t: "fill", q: "She ___ (be) to London three times. She loves it.", a: "has been", e: "With she, use has been for an experience." },
    { t: "mc", q: "We ___ played that game before, but we don't remember the rules.", o: ["have", "has", "did", "had to"], a: 0, e: "Have is used with we." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "My grandmother used to make bread every morning, but she doesn't do it anymore.", o: ["She still makes bread every morning.", "She makes bread only on holidays.", "She used to make bread every morning, but she has stopped.", "She never liked bread."], a: 3, e: "Used to shows a past habit that has stopped." },
    { t: "mc", q: "Have you ever ___ a marathon?", o: ["run", "ran", "running", "runs"], a: 0, e: "After have, use the past participle, but run stays run." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Have you ever eaten Japanese food? I have never been to Japan, but I have been to Dahab. It was amazing. When I was a child, I used to play in the street. Have you ever ridden a camel? I have never ridden one, but I used to ride a bicycle every day.", o: ["Did you ever eaten Japanese food?","Have you ever eaten Japanese food?","Have you ever eat Japanese food?","Do you ever have eaten Japanese food?"], a: 1, e: "Have ever + past participle.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Have you ever eaten Japanese food? I have never been to Japan, but I have been to Dahab. It was amazing. When I was a child, I used to play in the street. Have you ever ridden a camel? I have never ridden one, but I used to ride a bicycle every day.", o: ["I have went to Dahab.","I has been to Dahab.","I have been to Dahab.","I have be to Dahab."], a: 2, e: "Present perfect: have been.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Have you ever eaten Japanese food? I have never been to Japan, but I have been to Dahab. It was amazing. When I was a child, I used to play in the street. Have you ever ridden a camel? I have never ridden one, but I used to ride a bicycle every day.", o: ["When I was a child, I use to play in the street.","When I was a child, I used play in the street.","When I was a child, I am used to play in the street.","When I was a child, I used to play in the street."], a: 3, e: "Used to + base verb: a past habit.", rate: 1 },

], exam: EX([
  ["She ___ breakfast at 7 every day.", ["eats", "eat", "eating", "is eat"], 0, "With she, add s: eats."],
  ["We ___ to the cinema last Friday.", ["went", "goed", "go", "going"], 0, "Last Friday is finished, so use the past simple: went. Go is irregular."],
  ["I am ___ to visit my uncle on Sunday.", ["going", "go", "goes", "went"], 0, "Am going to plus a base verb is used for a plan you have already made: going."],
  ["There are ___ apples in the basket.", ["a few", "a little", "much", "less"], 0, "A few goes with countable nouns like apples. A little goes with uncountable nouns."],
  ["This book is ___ than that one.", ["more interesting", "interestinger", "the most interesting", "interesting"], 0, "Long adjectives form the comparative with more: more interesting."],
  ["He ___ play tennis on Mondays.", ["doesn't", "don't", "isn't", "not"], 0, "With he, she and it, the negative uses doesn't plus the base verb."],
  ["You ___ wear a seatbelt. It's the law.", ["must", "should to", "have", "musting"], 0, "Must shows a rule or a law you have to follow."],
  ["Ahmed ___ speak German.", ["can", "cans", "can to", "is can"], 0, "Can is a modal verb. It has no s and no to, and it is followed by the base verb."],
  ["What time ___ the shop open?", ["does", "do", "is", "are"], 0, "Questions with he, she and it use does plus the base verb: What time does the shop open?"],
  ["Look at the sky! It ___ right now.", ["is raining", "rains", "rain", "raining"], 0, "Right now means the action is happening at this moment, so use the present continuous."],
  ["I ___ drink a lot of coffee, but now I don't.", ["used to", "use to", "used", "am used to"], 0, "Used to describes a past habit that no longer happens."],
  ["My brother ___ his car yesterday.", ["washed", "washes", "wash", "washing"], 0, "Yesterday means the past simple, and wash is regular: washed."],
  ["___ you ever been to Japan?", ["Have", "Did", "Do", "Are"], 0, "Questions about experience use Have plus the past participle: Have you ever been to Japan?"],
  ["The meeting is ___ 10 o'clock.", ["at", "on", "in", "for"], 0, "We use at with clock times: at 10 o'clock."],
  ["I ___ the window because it was hot.", ["opened", "open", "opens", "opening"], 0, "A finished action in the past uses the past simple: opened."],
  ["She ___ a doctor when she grows up.", ["is going to be", "goes to be", "going to be", "will be to"], 0, "Is going to be shows a plan or intention for the future."],
  ["They ___ football on Saturdays.", ["play", "plays", "playing", "played"], 0, "With they, the base verb has no s: play."],
  ["I ___ my keys yesterday. I can't find them.", ["lost", "loose", "lose", "losing"], 0, "The past simple of lose is lost. Loose is an adjective meaning not tight."],
  ["He ___ to work by bus every day.", ["goes", "go", "going", "gone"], 0, "A routine with he, she or it takes s: goes."],
  ["It ___ be nice later. Let's go for a walk.", ["will", "is going", "goes", "going"], 0, "Will is used for a prediction or a guess about the future: It will be nice."]
])},
{ code: "B1", title: "Work English", sub: "Complaints, troubleshooting, and clear explanations", lessons: [
  { name: "Present perfect vs past simple", ex: [
    { t: "explain", title: "المضارع التام والماضي البسيط", body: "<p><b>المضارع التام</b> (have / has + V3) للتجربة أو لحاجة ليها تأثير لحد دلوقتي: I have visited Luxor.</p><p><b>الماضي البسيط</b> لوقت محدد وخلص: I visited Luxor in 2019. ولو فيه yesterday أو ago أو in 2019، استخدم الماضي البسيط.</p><p>الكلمات اللي بتيجي مع المضارع التام: ever، never، already، yet، just، since، for.</p>" },
    { t: "fill", q: "I ___ (never / eat) sushi, but I want to try it.", a: "have never eaten", e: "Never with the present perfect talks about experiences." },
    { t: "mc", q: "___ you ever ridden a camel?", o: ["Have", "Did", "Do", "Were"], a: 0, e: "Ever in questions usually goes with the present perfect." },
    { t: "mc", q: "They ___ their new house in 2021.", o: ["bought", "have bought", "have buying", "bought to"], a: 0, e: "A finished time (in 2021) needs the past simple." },
    { t: "dialog", q: "A: Have you seen the new film?\\nB: Yes, I ___ it last night. It was great.", o: ["saw", "have seen", "see", "have saw"], a: 0, e: "Last night is a finished time: past simple." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "I have lived in this city for ten years, and I still love it.", o: ["I moved to this city ten years ago and left.", "I still live in this city and have for ten years.", "I lived here only for a short time.", "I will move soon."], a: 2, e: "Present perfect with for shows an action that continues until now." },
    { t: "order", q: "Put the words in the right order.", words: ["finished", "just", "She", "exam", "has", "her"], a: "She has just finished her exam", e: "Just goes between has and the past participle." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I have already eaten breakfast." },
    { t: "fill", q: "We ___ (live) in London since 2015.", a: "have lived", e: "Use since with the present perfect." },
    { t: "mc", q: "He ___ his phone yesterday, and he still hasn't found it.", o: ["lost", "has lost", "loses", "has been losing"], a: 0, e: "Yesterday is a finished time: past simple." },
    { t: "mc", q: "I ___ my keys. Can you help me look for them?", o: ["have lost", "lost", "lose", "am losing"], a: 0, e: "The present perfect shows the result now: I cannot find them." },
    { t: "dialog", q: "A: Where is Sara?\\nB: She ___ to the bank. She will be back soon.", o: ["has gone", "went", "has been go", "goes"], a: 0, e: "Has gone means she is not here now." },
    { t: "mc", q: "How long ___ you studied English?", o: ["have", "did", "are", "were"], a: 0, e: "How long with the present perfect asks about a period until now." },
    { t: "fill", q: "The train ___ (leave) ten minutes ago.", a: "left", e: "Ago always goes with the past simple." },
    { t: "order", q: "Put the words in the right order.", words: ["you", "ever", "the", "Library", "visited", "Alexandria", "Have"], a: "Have you ever visited the Alexandria Library", e: "Ever goes between have and the past participle." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I've never been to Aswan." },
    { t: "mc", q: "Shakespeare ___ in the sixteenth century.", o: ["wrote", "has written", "has been writing", "writes"], a: 0, e: "A specific finished time in the past needs the past simple." },
    { t: "mc", q: "Look! The bus ___ just left. We have to run.", o: ["has", "is", "did", "was"], a: 0, e: "Has just left shows a result now." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hi Mona, have you ever been to Luxor? I have been there twice, and I visited the temples last summer. We had dinner at eight yesterday evening, but we haven't finished our holiday plans yet. She has already finished her homework, so she can help us now.", o: ["I have been there twice.","I am been there twice.","I have be there twice.","I has been there twice."], a: 0, e: "Present perfect: have + past participle.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hi Mona, have you ever been to Luxor? I have been there twice, and I visited the temples last summer. We had dinner at eight yesterday evening, but we haven't finished our holiday plans yet. She has already finished her homework, so she can help us now.", o: ["I have visited the temples last summer.","I visited the temples last summer.","I visit the temples last summer.","I visiting the temples last summer."], a: 1, e: "A finished time (last summer) needs the past simple.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Hi Mona, have you ever been to Luxor? I have been there twice, and I visited the temples last summer. We had dinner at eight yesterday evening, but we haven't finished our holiday plans yet. She has already finished her homework, so she can help us now.", o: ["She already has finish her homework.","She is already finishing her homework.","She has already finished her homework.","She has already finishes her homework."], a: 2, e: "Present perfect with already: has + past participle.", rate: 1 },
  ]},
  { name: "Present perfect continuous", ex: [
    { t: "explain", title: "المضارع التام المستمر", body: "<p>بنستخدم <b>have / has been + ing</b> لحاجة بدأت في الماضي ولسه مستمرة، أو لسه ليها أثر دلوقتي.</p><p>الكلمات المهمة: <b>for</b> (لفترة) و<b>since</b> (من وقت محدد). و<b>How long</b> بتسأل عن المدة.</p><p>مثال: <i>It has been raining all morning.</i> المطر مستمر، والأرض مبلولة دلوقتي.</p>" },
    { t: "dialog", q: "A: You look tired.\\nB: I ___ all day.", o: ["have been working", "have worked", "am working", "worked"], a: 0, e: "All day means an activity for a period of time." },
    { t: "mc", q: "How long ___ you been living here?", o: ["have", "has", "did", "are"], a: 0, e: "With you, use have." },
    { t: "order", q: "Put the words in the right order.", words: ["Cairo", "in", "living", "five", "years", "have", "for", "been", "They"], a: "They have been living in Cairo for five years", e: "Have been + ing, then for or since." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "My brother has been studying medicine for three years, and he is going to finish next summer.", o: ["He started studying three years ago and will finish next summer.", "He finished medicine three years ago.", "He has never studied medicine.", "He started next summer."], a: 0, e: "The present perfect continuous shows an ongoing action with an end in the future." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I've been learning English since last year." },
    { t: "mc", q: "The children ___ in the garden since lunchtime. They are very dirty now.", o: ["have been playing", "have played", "play", "are played"], a: 0, e: "The activity continued, and the result is seen now." },
    { t: "dialog", q: "A: Your hands are covered in paint!\\nB: I ___ the kitchen all afternoon.", o: ["have been painting", "have painted", "painted", "paint"], a: 0, e: "All afternoon shows a long activity." },
    { t: "fill", q: "It ___ (rain) since we arrived.", a: "has been raining", e: "Since with an activity that is still going on." },
    { t: "mc", q: "She ___ on her thesis for two years, and she still isn't finished.", o: ["has been working", "has worked", "worked", "is working"], a: 0, e: "Two years with no end yet: continuous shows the duration." },
    { t: "mc", q: "___ you been waiting long?", o: ["Have", "Has", "Did", "Were"], a: 0, e: "With you, use have." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "They have been waiting for the bus since eight o'clock." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "I have been trying to call you all morning, but your phone is off.", o: ["I called you this morning once.", "I have never tried to call you.", "I called you yesterday.", "I tried calling you for most of the morning without success."], a: 3, e: "Have been trying shows many attempts over a period of time." },
    { t: "mc", q: "We ___ a lot of progress this year.", o: ["have made", "made", "make", "making"], a: 0, e: "Have made is the present perfect for achievements." },
    { t: "fill", q: "Ahmed ___ (learn) to drive for three months.", a: "has been learning", e: "For three months: an activity that continues." },
    { t: "mc", q: "Hi! I ___ you for ages. Where have you been?", o: ["have been looking for", "looked for", "am looking for", "look for"], a: 0, e: "For ages: duration until now." },
    { t: "order", q: "Put the words in the right order.", words: ["How", "here", "they", "waiting", "have", "been", "long"], a: "How long have they been waiting here", e: "How long + have + subject + been + ing." },
    { t: "dialog", q: "A: Is Ali still working on the project?\\nB: Yes, he ___ on it since May.", o: ["has been working", "has worked", "worked", "is work"], a: 0, e: "Since May, with an action that continues." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I have worked for this company since 2018. You have been waiting for an hour, haven't you? Sorry about that. It has been raining all morning, so the roads are wet. I have been studying English for two years, and I am still learning every day.", o: ["I work for this company since 2018.","I have worked for this company since 2018.","I have work for this company since 2018.","I am working for this company since 2018."], a: 1, e: "Since + a point in time with the present perfect.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I have worked for this company since 2018. You have been waiting for an hour, haven't you? Sorry about that. It has been raining all morning, so the roads are wet. I have been studying English for two years, and I am still learning every day.", o: ["It is raining all morning.","It have been raining all morning.","It has been raining all morning.","It has be raining all morning."], a: 2, e: "Present perfect continuous: has been + verb-ing.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I have worked for this company since 2018. You have been waiting for an hour, haven't you? Sorry about that. It has been raining all morning, so the roads are wet. I have been studying English for two years, and I am still learning every day.", o: ["I have studying English for two years.","I am study English for two years.","I have been study English for two years.","I have been studying English for two years."], a: 3, e: "Continuous: have been + verb-ing.", rate: 1 },
  ]},
  { name: "Past continuous and past narrative", ex: [
    { t: "explain", title: "الماضي المستمر", body: "<p>بنستخدم <b>was / were + ing</b> لحدث كان شغال في وقت معين في الماضي.</p><p>بنستخدمه مع الماضي البسيط لما حاجة قاطعت الحدث: <i>I was watching TV when the phone rang.</i></p><p>الخلفية (الحدث الطويل) = الماضي المستمر. الحدث المفاجئ = الماضي البسيط.</p>" },
    { t: "mc", q: "At 8 p.m. last night, we ___ television.", o: ["were watching", "watched", "have watched", "are watching"], a: 0, e: "A specific time in the past needs the past continuous." },
    { t: "mc", q: "She ___ to work when she saw the accident.", o: ["was walking", "walked", "has walked", "is walking"], a: 0, e: "Was walking is the background; saw is the interruption." },
    { t: "fill", q: "It ___ (rain) hard when we left the house.", a: "was raining", e: "Was raining is used for a background situation." },
    { t: "order", q: "Put the words in the right order.", words: ["children", "While", "a", "I", "read", "were", "sleeping,", "book", "the"], a: "While the children were sleeping, I read a book", e: "While + past continuous, then the past simple for the main action." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "When I arrived, Sarah was cooking, and the kids were watching a film.", o: ["Sarah and the kids were busy when I arrived.", "Sarah had already finished cooking.", "Sarah and the kids were sleeping.", "The kids were not at home."], a: 0, e: "Was cooking and were watching describe activities in progress when I arrived." },
    { t: "dialog", q: "A: What were you doing at ten last night?\\nB: I ___ to bed.", o: ["was going", "went", "have gone", "am going"], a: 0, e: "Was going means I was in the process of going at ten." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I was walking home when it started to rain." },
    { t: "mc", q: "While he ___ the report, the phone kept ringing.", o: ["was writing", "wrote", "has written", "writes"], a: 0, e: "An ongoing action interrupted by something repeated." },
    { t: "mc", q: "The dog ___ in the garden when the thief came.", o: ["was sleeping", "slept", "has slept", "sleeps"], a: 0, e: "A background state in the past." },
    { t: "fill", q: "Everyone ___ (laugh) when the teacher walked in.", a: "was laughing", e: "Everyone takes was in the past continuous." },
    { t: "mc", q: "We ___ in the park when we heard the news.", o: ["were sitting", "sat", "have sat", "sit"], a: 0, e: "We were sitting: the ongoing action when the news came." },
    { t: "dialog", q: "A: Did you see Ahmed at the party?\\nB: Yes, he ___ with his sister when I arrived.", o: ["was talking", "talked", "has talked", "talks"], a: 0, e: "Was talking: ongoing when I arrived." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "I was driving to work when I suddenly remembered that I had forgotten my keys.", o: ["I drove to work without remembering anything.", "I forgot to go to work.", "I remembered my keys while I was driving.", "I had my keys all day."], a: 3, e: "The remembering happened in the middle of the driving." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "She was studying when the lights went out." },

  { name: "Second conditional", ex: [

  { name: "Third conditional", ex: [

  { name: "Reported speech", ex: [
    { t: "explain", title: "الكلام المنقول", body: "<p>لما ننقل كلام حد بعد وقت: الأزمنة بتتحول لماضي. <i>I am tired</i> → <i>He said he was tired.</i></p><p>will → would، can → could، have → had. الأسئلة بتتحول لجمل خبرية، و<b>if / whether</b> للأسئلة اللي إجابتها نعم أو لا.</p><p>الأوامر: <b>told / asked + object + to + base verb</b>.</p>" },
    { t: "mc", q: "I said that I ___ see her the next day.", o: ["could", "can", "will", "am"], a: 0, e: "Can becomes could." },
    { t: "mc", q: "She asked me where I ___.", o: ["lived", "live", "lives", "am living"], a: 0, e: "A question becomes a statement: the present becomes past." },

    { t: "mc", q: "He told me he ___ to Aswan the week before.", o: ["had been", "has been", "was", "is"], a: 0, e: "Has been becomes had been." },

    { t: "dialog", q: "A: Did you tell her the news?\\nB: Yes, I told her that we ___ moving to Alexandria.", o: ["were", "are", "will be", "had been"], a: 0, e: "Are moving becomes were moving." },
    { t: "mc", q: "\"I will finish this work tomorrow,\" he said. → He said he ___ that work the next day.", o: ["would finish", "will finish", "finishes", "finished"], a: 0, e: "Will becomes would." },

  { name: "Gerunds and infinitives", ex: [
    { t: "explain", title: "المصدر والـ ing", body: "<p>بعد بعض الأفعال بنستخدم <b>-ing</b>: enjoy، avoid، finish، mind، suggest، can't stand.</p><p>وبعد أفعال تانية بنستخدم <b>to + الفعل</b>: want، decide، hope، plan، agree، promise.</p><p>بعد الحروف (preposition) بنستخدم <b>-ing</b> دايماً: afraid of flying. وبعض الأفعال بتقبل الاتنين: like، love، start.</p>" },
    { t: "mc", q: "They hope ___ the football match on Friday.", o: ["to watch", "watching", "watch", "watched"], a: 0, e: "Hope + to-infinitive." },
    { t: "mc", q: "Would you mind ___ the window?", o: ["opening", "to open", "open", "opened"], a: 0, e: "Mind + -ing." },

    { t: "dialog", q: "A: Shall we go out tonight?\\nB: I'd love ___, but I have to work.", o: ["to go", "going", "go", "went"], a: 0, e: "Love can take the to-infinitive or -ing." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "He suggested going to the cinema, but I prefer to stay at home and read.", o: ["He wants to go to the cinema.", "I want to go out with him.", "He suggested going to the cinema; I want to stay at home.", "I suggested staying at home."], a: 3, e: "Suggest takes -ing; prefer takes to-infinitive." },

    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I enjoy listening to music in the evening. She decided to take a new job. We avoid driving in the city centre at rush hour. He promised to call me. Do you mind waiting for a few minutes?", o: ["I enjoy to listen to music in the evening.","I enjoy listening to music in the evening.","I enjoy listen to music in the evening.","I enjoy to listening to music in the evening."], a: 1, e: "Enjoy + -ing.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I enjoy listening to music in the evening. She decided to take a new job. We avoid driving in the city centre at rush hour. He promised to call me. Do you mind waiting for a few minutes?", o: ["She decided take a new job.","She decided taking a new job.","She decided to take a new job.","She decided to taking a new job."], a: 2, e: "Decide + to + base verb.", rate: 1 },

], exam: EX([
  ["I ___ Paris three times, and I loved it.", ["have visited", "visited", "visit", "was visiting"], 0, "Have visited is used for experiences in a period up to now, with no specific time."],
  ["If it ___ tomorrow, we will cancel the picnic.", ["rains", "will rain", "rained", "is raining"], 0, "First conditional: if plus present simple, then will: If it rains, we will cancel."],
  ["If I ___ rich, I would travel around the world.", ["were", "was", "will be", "am"], 0, "Second conditional (unreal present) uses were for all persons: If I were rich."],
  ["The letter ___ yesterday.", ["was sent", "sent", "is send", "has send"], 0, "Passive past simple: was plus the past participle, for a finished event: was sent."],
  ["She asked me where I ___ the night before.", ["had been", "have been", "was", "am"], 0, "In reported speech the tense moves back, so had been is the past perfect."],
  ["The man ___ called me yesterday is my uncle.", ["who", "which", "where", "whose"], 0, "Who is used for people in a defining relative clause."],
  ["I'm looking forward to ___ you soon.", ["seeing", "to see", "see", "saw"], 0, "Look forward to is followed by -ing: seeing."],
  ["She has been ___ English for three years.", ["studying", "study", "studied", "to study"], 0, "Present perfect continuous uses has been plus -ing for a period up to now: studying."],
  ["If he ___ earlier, he would have caught the bus.", ["had left", "left", "has left", "would leave"], 0, "Third conditional: if plus past perfect (had left), then would have plus the past participle."],
  ["We ___ dinner when the lights went out.", ["were having", "had", "have had", "are having"], 0, "Were having is the action in progress when the lights went out, a shorter event that interrupted it."],
  ["The house ___ in 1920.", ["was built", "built", "is built", "has built"], 0, "Passive past simple for a finished event in the past: was built."],
  ["I ___ my keys. Can you help me find them?", ["have lost", "lost", "lose", "am losing"], 0, "Present perfect shows a result now: I have lost my keys, so I cannot find them."],
  ["He told me he ___ the next day.", ["would call", "will call", "calls", "called"], 0, "In reported speech will changes to would: he would call."],
  ["She ___ to Dahab last summer.", ["went", "has gone", "has been", "goes"], 0, "Last summer is finished, so use the past simple: went. Has gone means she is still away."],
  ["I'd like ___ a cup of tea.", ["to have", "having", "have", "had"], 0, "I'd like is followed by to plus the base verb: to have."],
  ["If you ___ harder, you would have passed.", ["had studied", "studied", "study", "have studied"], 0, "Third conditional: if plus had studied, then would have passed."],
  ["The children ___ a film at the moment.", ["are watching", "watch", "watched", "have watched"], 0, "At the moment means happening now, so use the present continuous: are watching."],
  ["Ahmed ___ the email, so he is not worried.", ["has read", "read", "reads", "is reading"], 0, "Present perfect shows a completed action with a result now: has read."],
  ["The problem ___ by the new manager.", ["was solved", "solved", "has solve", "is solving"], 0, "Passive past simple for a finished event in the past: was solved."],
  ["The bus ___ just left. Look, it's gone!", ["has", "is", "did", "was"], 0, "Just with the present perfect shows a recent action: has just left."]
])},
{ code: "B2", title: "Professional English", sub: "Meetings, negotiation, and reports", lessons: [
  { name: "Future perfect and future continuous", ex: [

    { t: "mc", q: "They ___ the house by the end of the year.", o: ["will have finished", "will finish", "will be finishing", "finish"], a: 0, e: "By the end of the year: future perfect." },

  { name: "Mixed conditionals and wishes", ex: [
    { t: "explain", title: "الأمنيات والشروط المختلطة", body: "<p><b>I wish / If only + past simple</b> لأمنية عن الحاضر غير الواقعي: <i>I wish I were taller.</i></p><p><b>I wish / If only + past perfect</b> لندم على الماضي: <i>I wish I had studied harder.</i></p><p><b>شرط مختلط</b>: If + past perfect، would + base، لحاجة في الماضي أثرها في الحاضر: <i>If I had taken that job, I would be rich now.</i></p>" },

  { name: "Advanced passive and causatives", ex: [
    { t: "explain", title: "المبني للمجهول المتقدم والـ have / get", body: "<p><b>It is said / believed / expected that...</b> و<b>He is said to be...</b>، وده شائع في الكتابة الرسمية.</p><p><b>have / get + object + V3</b>: حد تاني عمل الشغل: <i>I had my car repaired.</i></p>" },
    { t: "fill", q: "We need to get the windows ___ (clean) before the guests arrive.", a: "cleaned", e: "Get something done." },
    { t: "mc", q: "The results ___ to be announced next week.", o: ["are expected", "expect", "expecting", "expected"], a: 0, e: "Are expected to be announced." },
    { t: "dialog", q: "A: Did you cut your hair yourself?\\nB: No, I ___ it done at the new salon.", o: ["had it", "had done it", "did it done", "made it done"], a: 0, e: "Have something done by someone else." },
    { t: "order", q: "Put the words in the right order.", words: ["thought", "worth", "millions", "be", "The", "to", "painting", "is"], a: "The painting is thought to be worth millions", e: "Is thought to be + noun." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "The bridge is believed to have been built by the Romans, but nobody is sure.", o: ["The Romans built the bridge for certain.", "Nobody knows if the bridge was built by the Romans.", "The bridge is new.", "The Romans never built bridges."], a: 1, e: "Believed to have been built means people think so, but it is not certain." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "My house was painted last summer, so I had it repainted." },
    { t: "mc", q: "He is said ___ a millionaire.", o: ["to be", "being", "be", "was"], a: 0, e: "He is said to be a millionaire." },
    { t: "fill", q: "You should get your teeth ___ (check) every six months.", a: "checked", e: "Get something done." },
    { t: "dialog", q: "A: Why is your phone in the shop?\\nB: I had it ___ because the screen was broken.", o: ["fixed", "fix", "to fix", "fixing"], a: 0, e: "Had it fixed: have + object + past participle." },
    { t: "mc", q: "It ___ that the company will close next year.", o: ["is predicted", "predicts", "predicting", "predicted"], a: 0, e: "Passive: it is predicted that..." },
    { t: "order", q: "Put the words in the right order.", words: ["seen", "leaving", "midnight", "was", "at", "the", "She", "building"], a: "She was seen leaving the building at midnight", e: "Passive of see + -ing." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I need to get my hair cut before the wedding." },
    { t: "mc", q: "The new law ___ to come into force in March.", o: ["is due", "dues", "is dueing", "due"], a: 0, e: "Is due to + base verb: expected to happen." },
    { t: "fill", q: "We had the kitchen ___ (renovate) last month.", a: "renovated", e: "Had + object + past participle." },
    { t: "dialog", q: "A: How did you get your car so clean?\\nB: I had it ___ this morning.", o: ["washed", "wash", "to wash", "washing"], a: 0, e: "Had it washed." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "The old palace is said to be haunted, so few people visit it at night.", o: ["People visit the palace at night.", "The palace is new.", "Nobody has heard of the palace.", "The palace is believed to be haunted, which keeps people away at night."], a: 3, e: "Is said to be means people believe it, and that keeps visitors away." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is said that the tower was built in the twelfth century. He is believed to have left the city before the war. She is expected to arrive at noon. I had my car repaired last week, so it runs well now.", o: ["It is say that the tower was built in the twelfth century.","It said that the tower was built in the twelfth century.","It is said that the tower was built in the twelfth century.","It is said that the tower built in the twelfth century."], a: 2, e: "It is said that + passive clause.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is said that the tower was built in the twelfth century. He is believed to have left the city before the war. She is expected to arrive at noon. I had my car repaired last week, so it runs well now.", o: ["She is expect arrive at noon.","She is expected arrive at noon.","She expects to be arrive at noon.","She is expected to arrive at noon."], a: 3, e: "Expected + to + base verb.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is said that the tower was built in the twelfth century. He is believed to have left the city before the war. She is expected to arrive at noon. I had my car repaired last week, so it runs well now.", o: ["I had my car repaired last week.","I had my car repairing last week.","I had my car repair last week.","I had my car repaired last week?"], a: 0, e: "Have + object + past participle for a service.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It is said that the tower was built in the twelfth century. He is believed to have left the city before the war. She is expected to arrive at noon. I had my car repaired last week, so it runs well now.", o: ["He is believed to left the city before the war.","He is believed to have left the city before the war.","He is believe to have left the city before the war.","He is believed have left the city before the war."], a: 1, e: "Believed to + have + past participle for the past.", rate: 1 },
  ]},
  { name: "Reported speech (advanced)", ex: [
    { t: "explain", title: "الكلام المنقول المتقدم", body: "<p>الأسئلة: <b>asked + if / whether / question word + subject + verb</b> بدون inversion.</p><p>الأوامر: <b>told / asked / warned + object + to</b>، والنهي بـ <b>not to</b>.</p><p>الأفعال زي <b>promised / suggested / admitted / denied / warned / advised</b> بتتبع بتراكيب مختلفة.</p>" },
    { t: "mc", q: "\"Don't touch that wire,\" he warned us. → He warned us ___ that wire.", o: ["not to touch", "not touch", "don't touch", "to not touch"], a: 0, e: "Warn + object + not to + base verb." },
    { t: "order", q: "Put the words in the right order.", words: ["her", "could", "lift", "whether", "home", "me", "asked", "a", "give", "She", "I"], a: "She asked me whether I could give her a lift home", e: "Whether + subject + could, with no inversion." },
    { t: "dialog", q: "A: What did the doctor say?\\nB: He ___ me to stop smoking.", o: ["advised", "said", "explained", "whispered"], a: 0, e: "Advise + object + to-infinitive." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "He admitted that he had broken the vase, but he denied that he had lied about it.", o: ["He broke the vase, but he denied lying about it.", "He did not break the vase.", "He never admitted anything.", "He lied about the vase, and he was happy."], a: 0, e: "Admitted and denied are reporting verbs." },
    { t: "mc", q: "\"Shall we go to the cinema?\" she said. → She suggested ___ to the cinema.", o: ["going", "to go", "go", "went"], a: 0, e: "Suggest + -ing." },
    { t: "mc", q: "\"I might be late,\" said Sam. → Sam said he ___ late.", o: ["might be", "may be", "would be", "is"], a: 0, e: "Might stays the same in reported speech." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "She asked me if I had seen her keys." },
    { t: "fill", q: "\"Where do you live?\" she asked. → She asked me where I ___ (live).", a: "lived", e: "Present becomes past in reported speech." },
    { t: "mc", q: "\"Don't be late,\" my mum said. → My mum told me ___ late.", o: ["not to be", "not be", "don't be", "to not be"], a: 0, e: "Told + object + not to + base verb." },
    { t: "dialog", q: "A: What did he say about the project?\\nB: He ___ that the deadline had been moved.", o: ["mentioned", "asked", "ordered", "begged"], a: 0, e: "Mentioned that: a reporting verb." },
    { t: "mc", q: "\"I didn't see the accident,\" she said. → She said she ___ the accident.", o: ["hadn't seen", "didn't see", "hasn't seen", "wouldn't see"], a: 0, e: "Didn't becomes hadn't." },
    { t: "order", q: "Put the words in the right order.", words: ["that", "should", "stay", "insisted", "dinner", "for", "He", "we"], a: "He insisted that we should stay for dinner", e: "Insist that + should + base verb." },
    { t: "mc", q: "\"I'll call you back,\" she said. → She promised ___.", o: ["to call me back", "calling me back", "call me back", "that she calls"], a: 0, e: "Promise + to-infinitive." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "He warned us not to go near the river." },
    { t: "mc", q: "\"We have finished the report,\" they said. → They told us they ___ the report.", o: ["had finished", "have finished", "finished", "finishing"], a: 0, e: "Present perfect becomes past perfect." },
    { t: "mc", q: "\"Could you open the window, please?\" he asked me. → He asked me ___ the window.", o: ["to open", "open", "opening", "if open"], a: 0, e: "Request: asked + object + to-infinitive." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Yesterday my manager asked me if I had locked the door. Then she asked me where I had been. She promised she would help me the next day. Then she asked whether I had finished the report.", o: ["My manager asks me if I had locked the door.","My manager asked me if I lock the door.","My manager asked me that I had locked the door.","My manager asked me if I had locked the door."], a: 3, e: "Reported question: if + past perfect.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Yesterday my manager asked me if I had locked the door. Then she asked me where I had been. She promised she would help me the next day. Then she asked whether I had finished the report.", o: ["She promised she would help me the next day.","She promised she will help me the next day.","She promised to helping me the next day.","She promise she would help me the next day."], a: 0, e: "Promise + would in reported speech.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Yesterday my manager asked me if I had locked the door. Then she asked me where I had been. She promised she would help me the next day. Then she asked whether I had finished the report.", o: ["She asked me where have I been.","She asked me where I had been.","She asked me where I have been.","She asked me where I was been."], a: 1, e: "Reported question: question word + past perfect.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Yesterday my manager asked me if I had locked the door. Then she asked me where I had been. She promised she would help me the next day. Then she asked whether I had finished the report.", o: ["Then she asked whether I finished the report?","Then she asks whether I had finished the report.","Then she asked whether I had finished the report.","Then she asked whether had I finished the report."], a: 2, e: "Whether + past perfect in reported questions.", rate: 1 },
  ]},
  { name: "Inversion and emphasis", ex: [
    { t: "explain", title: "الانقلاب في الجملة للتأكيد", body: "<p>بعد كلمات النفي أو الحصر، بنقلب ترتيب الجملة للتأكيد: <b>Never have I seen...</b>، <b>Not only did he...</b>، <b>Rarely do we...</b>.</p><p><b>No sooner had I arrived than...</b> و<b>Hardly had she left when...</b> و<b>Only after... did I...</b>.</p>" },
    { t: "mc", q: "Hardly ___ started when the power went out.", o: ["had the meeting", "the meeting had", "did the meeting", "the meeting did"], a: 0, e: "Hardly + had + subject + past participle, then when." },
    { t: "order", q: "Put the words in the right order.", words: ["Never", "him", "I", "with", "money", "again", "will", "trust"], a: "Never again will I trust him with money", e: "Never again + will + subject + base verb." },
    { t: "dialog", q: "A: Did you see the film?\\nB: Not only ___ it, but I also read the book.", o: ["did I see", "I saw", "I did see", "saw I"], a: 0, e: "Not only did I see." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "Only after the storm had passed did the villagers return to their homes.", o: ["The villagers returned before the storm.", "The villagers did not return at all.", "The villagers came back only when the storm was over.", "The storm passed after the villagers returned."], a: 2, e: "Only after + inversion shows the return happened after the storm." },
    { t: "mc", q: "Seldom ___ such dedication in a young student.", o: ["have I seen", "I have seen", "I saw", "saw I"], a: 0, e: "Seldom + inversion." },
    { t: "fill", q: "Little ___ (she / know) about the plan.", a: "did she know", e: "Little + inversion for emphasis." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "Never have I felt so proud of my team." },
    { t: "mc", q: "Under no circumstances ___ the door open.", o: ["should you leave", "you should leave", "do you leave", "leave you"], a: 0, e: "Under no circumstances + inversion." },
    { t: "mc", q: "Scarcely ___ the bus stopped when the passengers rushed out.", o: ["had", "did", "has", "was"], a: 0, e: "Scarcely had ... when." },
    { t: "dialog", q: "A: Why are you so happy?\\nB: Not only ___ the job, but I also got a pay rise.", o: ["did I get", "I got", "I did get", "got I"], a: 0, e: "Not only did I get." },
    { t: "mc", q: "Only in this way ___ we succeed.", o: ["can", "we can", "do we", "we do"], a: 0, e: "Only in this way + inversion." },
    { t: "order", q: "Put the words in the right order.", words: ["by", "have", "restaurant", "I", "Rarely", "been", "so", "a", "disappointed"], a: "Rarely have I been so disappointed by a restaurant", e: "Rarely + have + subject + past participle." },
    { t: "mc", q: "Here ___ the answers you asked for.", o: ["are", "is", "do", "have"], a: 0, e: "Here + be + subject for emphasis." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "No sooner had we arrived than it started to rain." },
    { t: "mc", q: "Little ___ that the new job would change his life.", o: ["did he know", "he knew", "knew he", "he did know"], a: 0, e: "Little did he know." },
    { t: "mc", q: "Had I known about the problem, I ___ earlier.", o: ["would have helped", "would help", "will help", "helped"], a: 0, e: "Had + subject instead of if." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Never have I seen such a beautiful view. Not only did he pass the exam, but he also got the highest grade. Rarely do we eat out on weekdays. Seldom have they been so happy.", o: ["Never have I seen such a beautiful view.","Never I have seen such a beautiful view.","Never I saw such a beautiful view.","Never have I see such a beautiful view."], a: 0, e: "Never + inverted auxiliary.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Never have I seen such a beautiful view. Not only did he pass the exam, but he also got the highest grade. Rarely do we eat out on weekdays. Seldom have they been so happy.", o: ["Not only he passed the exam, but he also got the highest grade.","Not only did he pass the exam, but he also got the highest grade.","Not only did he passed the exam, but he also got the highest grade.","Not only he did pass the exam, but he also got the highest grade."], a: 1, e: "Not only + did + subject + base verb.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Never have I seen such a beautiful view. Not only did he pass the exam, but he also got the highest grade. Rarely do we eat out on weekdays. Seldom have they been so happy.", o: ["Rarely we do eat out on weekdays.","Rarely we eat out on weekdays.","Rarely do we eat out on weekdays.","Rarely did we eats out on weekdays."], a: 2, e: "Rarely + do + subject + base verb.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Never have I seen such a beautiful view. Not only did he pass the exam, but he also got the highest grade. Rarely do we eat out on weekdays. Seldom have they been so happy.", o: ["Seldom they have been so happy.","Seldom have they being so happy.","Seldom they were so happy.","Seldom have they been so happy."], a: 3, e: "Seldom + inverted present perfect.", rate: 1 },
  ]},
  { name: "Linking words and contrast", ex: [
    { t: "explain", title: "حروف الربط", body: "<p><b>although / even though / though</b> + جملة كاملة. <b>despite / in spite of</b> + اسم أو ing.</p><p><b>however / nevertheless / nonetheless</b> = مع ذلك، وبتيجي غالباً في أول الجملة الجديدة ومعاها فاصلة.</p><p><b>therefore / consequently</b> = لذلك، وده للنتيجة.</p>" },
    { t: "mc", q: "The road was closed. ___, we arrived on time.", o: ["Consequently", "Nevertheless", "Although", "Despite"], a: 1, e: "Nevertheless shows a contrast with the expected result." },
    { t: "order", q: "Put the words in the right order.", words: ["Despite", "weather,", "planned", "the", "match", "bad", "went", "the", "as", "ahead"], a: "Despite the bad weather, the match went ahead as planned", e: "Despite + noun phrase, then the main clause." },
    { t: "dialog", q: "A: I didn't study, so I failed.\\nB: ___ you didn't study, you could have asked for help.", o: ["Although", "Despite", "However", "Therefore"], a: 0, e: "Although + subject + verb." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "Despite having little experience, she was hired because of her strong communication skills.", o: ["She was hired although she had a lot of experience.", "She was hired despite her limited experience, because of her communication skills.", "She was not hired.", "She had good experience but poor communication."], a: 2, e: "Despite + -ing shows a contrast with a reason for the result." },
    { t: "mc", q: "___ the traffic, we arrived late.", o: ["In spite of", "Although", "However", "Therefore"], a: 0, e: "In spite of + noun." },
    { t: "fill", q: "The hotel was expensive; ___, it was very comfortable.", a: "however", e: "However shows a contrast; comma before it." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "Although the film was long, I really enjoyed it." },
    { t: "mc", q: "The plan failed. ___, we tried again the next week.", o: ["Therefore", "Nevertheless", "Despite", "Although"], a: 1, e: "Nevertheless: despite that." },
    { t: "mc", q: "She passed the exam ___ she had very little time to study.", o: ["even though", "despite", "in spite", "however"], a: 0, e: "Even though + subject + verb." },
    { t: "dialog", q: "A: Why did the factories close?\\nB: ___ the rise in costs, many of them shut down.", o: ["Because of", "Although", "However", "Nevertheless"], a: 0, e: "Because of + noun." },
    { t: "mc", q: "The city is beautiful; ___, it is quite expensive to live there.", o: ["however", "despite", "although", "therefore"], a: 0, e: "However introduces a contrast." },
    { t: "order", q: "Put the words in the right order.", words: ["he", "the", "race,", "He", "didn't", "ran", "but", "than", "better", "ever", "win"], a: "He didn't win the race, but he ran better than ever", e: "But is a linking word too." },
    { t: "mc", q: "___ she was feeling ill, she went to work.", o: ["Even though", "Despite", "In spite", "Because"], a: 0, e: "Even though + subject + verb." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "Despite the rain, we enjoyed the trip." },
    { t: "mc", q: "The food was delicious; ___, the service was very slow.", o: ["however", "despite", "although", "therefore"], a: 0, e: "However introduces a contrast." },
    { t: "mc", q: "It rained all day, ___ we decided to go to the beach.", o: ["nevertheless", "despite", "although", "therefore"], a: 0, e: "Nevertheless introduces the result of a contrast." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Although it was raining, we went for a walk. We stayed at home because the weather was bad. She is very talented. However, she is quite lazy.", o: ["Although it raining, we went for a walk.","Although it was raining, we went for a walk.","Although it was rain, we went for a walk.","Although it was raining, we went for walk."], a: 1, e: "Although + clause, clause.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Although it was raining, we went for a walk. We stayed at home because the weather was bad. She is very talented. However, she is quite lazy.", o: ["We stayed at home because of the weather was bad.","We stayed at home because the weather bad.","We stayed at home because the weather was bad.","We stayed home because weather was bad."], a: 2, e: "Because + clause (because of + noun).", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Although it was raining, we went for a walk. We stayed at home because the weather was bad. She is very talented. However, she is quite lazy.", o: ["However, she quite lazy.","However, she is quite lazily.","However, she is quite laziness.","However, she is quite lazy."], a: 3, e: "However + clause: contrast.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Although it was raining, we went for a walk. We stayed at home because the weather was bad. She is very talented. However, she is quite lazy.", o: ["She is very talented.","She is very talent.","She is very talenting.","She is very talentedly."], a: 0, e: "Adjective: talented.", rate: 1 },
  ]},
  { name: "Phrasal verbs", ex: [
    { t: "explain", title: "الأفعال المركبة", body: "<p>الفعل المركب = فعل + حرف جر أو ظرف، ومعناه غالباً مختلف عن كل كلمة لوحدها: <i>give up</i> = يتوقف، <i>look after</i> = يعتني بـ.</p><p>بعضها بيتفصل بالمفعول: <i>turn the light off</i> أو <i>turn off the light</i>. لكن <i>look after</i> ما بتتفصلش.</p>" },
    { t: "mc", q: "The plane ___ at seven and landed at nine.", o: ["took off", "took on", "took in", "took up"], a: 0, e: "Take off means leave the ground." },
    { t: "order", q: "Put the words in the right order.", words: ["gave", "smoking", "last", "year", "up", "She", "finally"], a: "She finally gave up smoking last year", e: "Give up means stop." },
    { t: "dialog", q: "A: Did you accept the job?\\nB: No, I ___ it because the salary was too low.", o: ["turned down", "turned up", "turned out", "turned over"], a: 0, e: "Turn down means refuse." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "I'm going to look into the problem and find out what caused it.", o: ["I am going to ignore the problem.", "I will look at the window.", "I will investigate the problem.", "I will forget the problem."], a: 2, e: "Look into means investigate." },
    { t: "mc", q: "Our flight was ___ because of the storm.", o: ["called off", "called up", "called in", "called on"], a: 0, e: "Call off means cancel." },
    { t: "fill", q: "Please ___ (hand in) your homework before Friday.", a: "hand in", e: "Hand in means submit." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I'm going to look after the dog while you're away." },
    { t: "mc", q: "The fire ___ quickly, and the firefighters came in minutes.", o: ["broke out", "broke down", "broke up", "broke in"], a: 0, e: "Break out means start suddenly." },
    { t: "mc", q: "He ___ the old computer and bought a new one.", o: ["got rid of", "got over", "got on", "got through"], a: 0, e: "Get rid of means throw away." },
    { t: "dialog", q: "A: Are you still angry about the argument?\\nB: No, I ___ it. It was a long time ago.", o: ["got over", "got up", "got off", "got on"], a: 0, e: "Get over means recover from." },
    { t: "mc", q: "Please ___ the lights when you leave the room.", o: ["switch off", "switch on", "switch in", "switch up"], a: 0, e: "Switch off means turn off." },
    { t: "order", q: "Put the words in the right order.", words: ["to", "need", "up", "ran", "home", "of", "out", "pick", "on", "some", "we", "way", "We", "milk,", "so", "the"], a: "We ran out of milk, so we need to pick some up on the way home", e: "Pick up means buy or collect." },
    { t: "mc", q: "I ___ an old friend yesterday by chance.", o: ["ran into", "ran out", "ran over", "ran away"], a: 0, e: "Run into means meet by chance." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "I ran into my old teacher at the supermarket." },
    { t: "mc", q: "Can you ___ the bill? I'll pay you back tomorrow.", o: ["pick up", "pick off", "pick on", "pick out"], a: 0, e: "Pick up the bill means pay it." },
    { t: "mc", q: "I need to ___ my English before the exam.", o: ["brush up on", "brush off", "brush up to", "brush away"], a: 0, e: "Brush up on means improve a skill." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Could you turn off the light before you leave? We need to put off the meeting until next week. She looks after her little brother while her parents work. Please pick up the kids at five.", o: ["Could you turned off the light before you leave?","Could you turn off the light before you leaving?","Could you turn off the light before you leave?","Could you turns off the light before you leave?"], a: 2, e: "Modal + base verb (turn off).", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "Could you turn off the light before you leave? We need to put off the meeting until next week. She looks after her little brother while her parents work. Please pick up the kids at five.", o: ["We need to put of the meeting until next week.","We need to puts off the meeting until next week.","We need put off the meeting until next week.","We need to put off the meeting until next week."], a: 3, e: "Need + to + base verb (put off).", rate: 1 },

  { name: "Articles (a, an, the, no article)", ex: [
    { t: "explain", title: "أدوات التعريف والتنكير", body: "<p><b>a / an</b> للمفرد غير المحدد أول مرة. <b>the</b> للحاجة المعروفة أو المحددة، وللأشياء الفريدة: the sun، the Nile.</p><p>مفيش article مع الجمع أو غير المعدود لو بنتكلم بشكل عام: <i>Children need love.</i> ومع الوجبات: <i>have lunch</i>.</p>" },
    { t: "mc", q: "___ Nile is the longest river in Africa.", o: ["The", "A", "An", "Some"], a: 0, e: "The Nile: a unique river." },
    { t: "order", q: "Put the words in the right order.", words: ["book", "on", "mine", "the", "is", "The", "table"], a: "The book on the table is mine", e: "Specific book: the." },
    { t: "dialog", q: "A: Can you pass me ___ salt, please?\\nB: Here you are.", o: ["the", "a", "an", "some"], a: 0, e: "The salt: a specific item both speakers know." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "I need a doctor, but the doctor I usually see is on holiday.", o: ["My usual doctor is on holiday, so I need another one.", "I am a doctor on holiday.", "I see a doctor every day.", "The doctors are all on holiday."], a: 0, e: "A doctor means any doctor; the doctor means a specific one." },

    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "The Egyptian Museum is in Tahrir Square." },
    { t: "mc", q: "What ___ beautiful day!", o: ["a", "an", "the", "(no article)"], a: 0, e: "What a + adjective + noun." },

    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I bought an umbrella yesterday. She is an engineer. The sun rises in the east. I'd like a coffee, please. The coffee here is very good.", o: ["I bought an umbrella yesterday.","I bought a umbrella yesterday.","I bought a an umbrella yesterday.","I bought umbrella yesterday."], a: 0, e: "Use an before a vowel sound.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I bought an umbrella yesterday. She is an engineer. The sun rises in the east. I'd like a coffee, please. The coffee here is very good.", o: ["She is a engineer.","She is an engineer.","She is engineer.","She is an engineers."], a: 1, e: "Use an before a vowel sound (engineer).", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I bought an umbrella yesterday. She is an engineer. The sun rises in the east. I'd like a coffee, please. The coffee here is very good.", o: ["Sun rises in the east.","A sun rises in the east.","The sun rises in the east.","The sun rise in the east."], a: 2, e: "Use the for unique things like the sun.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "I bought an umbrella yesterday. She is an engineer. The sun rises in the east. I'd like a coffee, please. The coffee here is very good.", o: ["I'd like a coffees, please.","I'd like an coffee, please.","I'd like a the coffee, please.","I'd like a coffee, please."], a: 3, e: "Use a with a single countable item.", rate: 1 },

  { name: "Cleft sentences and emphasis", ex: [
    { t: "explain", title: "الجمل المقسومة للتأكيد", body: "<p>لتركيز المعلومة نقسم الجملة: <b>It was ... who / that ...</b>، و<b>What I need is ...</b>، و<b>All I want is ...</b>.</p><p>مثال: <i>It was my brother who broke the window.</i></p>" },
    { t: "mc", q: "The thing I love most ___ hiking in the mountains.", o: ["is", "are", "was", "be"], a: 0, e: "The thing + clause + is." },
    { t: "order", q: "Put the words in the right order.", words: ["rule", "the", "teacher", "It", "explained", "who", "the", "was"], a: "It was the teacher who explained the rule", e: "It was + person + who." },
    { t: "dialog", q: "A: Who called you?\\nB: It was my sister ___ called.", o: ["who", "which", "where", "what"], a: 0, e: "It was + person + who." },
    { t: "listen", q: "Listen, then choose the meaning.", text: "What surprised me most was how calm everyone remained during the crisis.", o: ["Everyone was surprised by the crisis.", "I was calm during the crisis.", "The thing that surprised me was how calm everyone was.", "The crisis was very short."], a: 2, e: "What surprised me is the focus, so it is emphasised." },
    { t: "mc", q: "It is money ___ they need most.", o: ["that", "which", "where", "when"], a: 0, e: "It is + thing + that." },
    { t: "mc", q: "What we ___ is a bigger house.", o: ["need", "needs", "needed", "needing"], a: 0, e: "What we need is..." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "It was the rain that ruined our plans." },
    { t: "fill", q: "It ___ (be) my friend who helped me move house.", a: "was", e: "It was + person + who." },
    { t: "mc", q: "The reason he left ___ he was unhappy at work.", o: ["was that", "was because", "that", "is"], a: 0, e: "The reason + was + that." },
    { t: "dialog", q: "A: Did you buy the car?\\nB: No, what I bought ___ a bicycle.", o: ["was", "is", "were", "be"], a: 0, e: "What I bought was a bicycle." },
    { t: "mc", q: "It was not until 2010 ___ the law changed.", o: ["that", "who", "which", "where"], a: 0, e: "It was not until ... that ..." },
    { t: "order", q: "Put the words in the right order.", words: ["left", "is", "we", "that", "The", "money", "have", "no", "problem"], a: "The problem is that we have no money left", e: "The problem is that + clause." },
    { t: "mc", q: "What he wants ___ a new job.", o: ["is", "are", "was", "be"], a: 0, e: "What he wants is..." },
    { t: "speak", q: "Say this sentence out loud.", text: "Say this sentence out loud.", e: "It's the taste that I love about coffee." },
    { t: "mc", q: "All she ___ is a little respect.", o: ["wants", "want", "wanting", "to want"], a: 0, e: "All she wants is..." },
    { t: "mc", q: "It was the manager ___ decided to close the shop.", o: ["who", "which", "where", "when"], a: 0, e: "It was + person + who." },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It was my brother who broke the window. It was in Cairo that we first met. What I really need is a good night's sleep. All she wants is a little respect. It is the cold weather that I hate most.", o: ["It was my brother which broke the window.","It was my brother who broke the window.","It were my brother who broke the window.","It is my brothers who broke the window."], a: 1, e: "It was + person + who.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It was my brother who broke the window. It was in Cairo that we first met. What I really need is a good night's sleep. All she wants is a little respect. It is the cold weather that I hate most.", o: ["It was in Cairo which we first met.","It was in Cairo where we first meeting.","It was in Cairo that we first met.","It was in Cairo who we first met."], a: 2, e: "It was + place + that.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It was my brother who broke the window. It was in Cairo that we first met. What I really need is a good night's sleep. All she wants is a little respect. It is the cold weather that I hate most.", o: ["What I really need are a good night's sleep.","What I really needs is a good night's sleep.","What I really need be a good night's sleep.","What I really need is a good night's sleep."], a: 3, e: "What + clause + is + the emphasis.", rate: 1 },
    { t: "listen", q: "Which sentence did you hear in the conversation?", text: "It was my brother who broke the window. It was in Cairo that we first met. What I really need is a good night's sleep. All she wants is a little respect. It is the cold weather that I hate most.", o: ["It is the cold weather that I hate most.","It is the cold weather who I hate most.","It is the cold weather which I hates most.","It is the cold weathers that I hate most."], a: 0, e: "It is + noun + that.", rate: 1 },
